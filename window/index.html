<style>
/* 介面：與〈An endless coast〉〈A slow afternoon〉同一套。Instrument Serif，字一律白色，細線分隔，不加卡片 */
:root{
  --ink:#19150c;
  --ui:#ffffff;
  --ui-dim:rgba(255,255,255,.62);
  --rule:rgba(255,255,255,.45);
  --serif:"Instrument Serif","Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--ui);font-family:var(--serif)}
#c{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.hud{position:fixed;left:0;right:0;pointer-events:none;display:flex;justify-content:flex-end;align-items:flex-end;gap:24px;padding-inline:28px;text-shadow:0 0 2px rgba(0,0,0,.45),0 1px 12px rgba(0,0,0,.5)}
.hud.bottom{bottom:0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.keys{display:flex;flex-direction:column;align-items:stretch;gap:2px;font-size:16px;line-height:1.35}
button.k{display:grid;grid-template-columns:2em 1fr;column-gap:14px;align-items:center;text-align:left}
.keys b{font-weight:400;letter-spacing:.14em;font-size:12px;text-align:right;color:var(--ui-dim)}
.keys i{font-style:italic}
.keys .off{color:var(--ui-dim)}
button.k{pointer-events:auto;font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-shadow:inherit}
button.k:hover i{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
button.k:focus-visible{outline:1px solid var(--ui);outline-offset:2px}
#uiBtn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px));font:inherit;font-style:italic;font-size:16px;color:var(--ui);background:none;border:0;border-bottom:1px solid var(--rule);padding:6px 0 3px;cursor:pointer;text-shadow:0 0 2px rgba(0,0,0,.45),0 1px 12px rgba(0,0,0,.5);opacity:.85;-webkit-tap-highlight-color:transparent}
#uiBtn:hover{opacity:1}
#uiBtn:focus-visible{outline:1px solid var(--ui);outline-offset:4px}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:0 28px calc(56px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(10,9,6,.78),rgba(10,9,6,.25) 50%,rgba(10,9,6,0) 75%);transition:opacity 1.6s}
#intro.gone{opacity:0;pointer-events:none}
#start{font:inherit;font-size:22px;color:var(--ui);background:none;border:0;border-bottom:1px solid var(--ui);padding:0 0 4px;cursor:pointer;letter-spacing:.02em}
#start span{display:inline-block;transition:transform .3s}
#start:hover span{transform:translateX(6px)}
#start:focus-visible{outline:1px solid var(--ui);outline-offset:6px}
@media (max-width:560px){.hud{padding-inline:16px;gap:12px}#intro{padding-inline:16px}.keys{font-size:15px}#uiBtn{right:calc(16px + env(safe-area-inset-right,0px))}}
@media (hover:none){.keys{gap:8px;font-size:19px;align-items:flex-end}.keys b{display:none}button.k{display:flex;justify-content:center;min-width:132px;min-height:46px;padding:0 18px;box-sizing:border-box;border:1px solid var(--rule);background:rgba(10,9,6,.28)}button.k:active{background:rgba(255,255,255,.18)}#uiBtn{font-size:18px;min-height:44px;padding:0 16px;border:1px solid var(--rule);background:rgba(10,9,6,.28);touch-action:manipulation}}
@media (prefers-reduced-motion:reduce){#intro{transition:none}#start span{transition:none}}
</style>

<canvas id="c" aria-label="Sitting at a table, looking out of a big window at a tree-lined Taiwanese street"></canvas>
<div class="hud bottom" id="hud" hidden>
  <div class="keys" id="keys"></div>
</div>
<button id="uiBtn" type="button" hidden>Hide UI</button>
<div id="intro">
  <button id="start" type="button">Sit by the window <span>&rarr;</span></button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

/* ---------- 參數 ---------- */
const BASE_H = 540;   // 內部解析度與前兩個場景相同：點陣顆粒一樣大

// 二樓的房間（公尺）：窗牆內面在 z = 0，室內往 +z；窗外往 -z 是街道。地板 y = 0，街面 y = GROUND
const RX = 3.4, RZ1 = 4.6, RH = 3.0, WT = 0.3;
const WIN = { x0:-1.2, x1:1.2, y0:0.9, y1:2.72 };   // 窗洞：照使用者的圖一（吊扇房間那扇）：兩扇推拉窗、上方氣窗
const TRANSOM = 2.24, FZ = -0.15;                    // 氣窗橫料高度、窗框所在的深度
const GROUND = -3.8;                                 // 街面（二樓）
const EYE = new THREE.Vector3(0.15, 1.12, 1.15);      // 沒有桌子，直接坐在窗前椅子上的眼睛（使用者的圖二，第一人稱）
const HOME = { yaw: 0, pitch: 0.12 };
const YAW_SPAN = 0.85, PITCH_MIN = -0.78, PITCH_MAX = 0.42;
// 街道配置（z）：近側人行道 0～-4、路面 -4～-13（兩側停車帶、雙向各一車道）、對面人行道 -13～-16.5、騎樓到 -19.5
const ROAD0 = -4, ROAD1 = -13, FAR_WALK = -16.5, ARCADE = -19.5;
const LANE = { nearCar:-7.1, nearScoot:-6.0, farCar:-10.0, farScoot:-11.2 };
const XST = { x0:6.5, x1:15.5, r0:8.5, r1:13.5 };    // 右前方的巷口（T 字路口），巷子往遠處延伸成綠色隧道
const ZEBRA = { x0:4.8, x1:8.0 };

/* ---------- 共用噪聲與亂數 ---------- */
function mulberry(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
const R = mulberry(20261010);
const pick = a => a[Math.floor(R()*a.length)];
const ss = THREE.MathUtils.smoothstep, lerp = THREE.MathUtils.lerp, clamp = THREE.MathUtils.clamp;

/* ---------- 渲染器：低解析 render target → 自然色 + Bayer 網點（與吊扇同一條管線） ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
const rt = new THREE.WebGLRenderTarget(4, 4, { minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter, type:THREE.HalfFloatType });
rt.depthTexture = new THREE.DepthTexture(4, 4); rt.depthTexture.type = THREE.UnsignedIntType;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbcd0e0, 0.006);
const camera = new THREE.PerspectiveCamera(60, 1, 0.03, 1400);
camera.rotation.order = 'YXZ';
camera.position.copy(EYE);

const post = new THREE.ShaderMaterial({
  uniforms:{ tScene:{ value: rt.texture }, tDepth:{ value: rt.depthTexture }, uInvProj:{ value: new THREE.Matrix4() }, uT:{ value: 0 }, uExp:{ value: 1.0 }, uPS:{ value: new THREE.Vector2(1,1) }, uFlash:{ value: 0 }, uRain:{ value: 0 }, uAsp:{ value: 1.78 }, uGlare:{ value: 1 }, uOut:{ value: 1.5 }, uViewInv:{ value: new THREE.Matrix4() } },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader:`
    uniform sampler2D tScene; uniform sampler2D tDepth; uniform mat4 uInvProj; uniform float uT, uExp, uFlash, uRain, uAsp, uGlare, uOut; uniform mat4 uViewInv; uniform vec2 uPS; varying vec2 vUv;
    float bayer2(vec2 a){ a=floor(a); return fract(dot(a, vec2(.5, a.y*.75))); }
    float bayer4(vec2 a){ return bayer2(.5*a)*.25 + bayer2(a); }
    float bh(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5); }
    float bn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(bh(i),bh(i+vec2(1,0)),f.x), mix(bh(i+vec2(0,1)),bh(i+vec2(1,1)),f.x), f.y); }
    // 室內牆角、物體交界處的漫射遮蔽（螢幕空間 AO）
    vec3 vpos(vec2 uv){ float z = texture2D(tDepth, uv).x*2. - 1.; vec4 v = uInvProj * vec4(uv*2. - 1., z, 1.); return v.xyz / v.w; }
    float wz(vec2 uv){ return (uViewInv * vec4(vpos(uv), 1.)).z; }   // 世界座標 z：窗框外（z < -0.3）就是窗外
    float ssao(){
      vec3 P = vpos(vUv);
      if (-P.z > 9.) return 1.;
      vec3 N = normalize(cross(dFdx(P), dFdy(P))); if (dot(N, P) > 0.) N = -N;
      const float RAD = 0.45;
      vec2 sr = RAD * uPS / -P.z * 0.5;
      float a0 = bayer4(gl_FragCoord.xy) * 6.2832, occ = 0.;
      for (int i = 0; i < 10; i++){
        float fi = float(i), a = a0 + fi * 2.3999, rr = (fi + 0.5) / 10.;
        vec3 Q = vpos(vUv + vec2(cos(a), sin(a)) * sr * rr);
        vec3 D = Q - P; float dl = length(D);
        occ += max(0., dot(N, D / max(dl, 1e-4)) - 0.08) * (1. - smoothstep(RAD*0.6, RAD*1.4, dl));
      }
      return clamp(1. - occ / 10. * 1.5, 0.3, 1.);
    }
    vec3 aces(vec3 x){ return clamp((x*(2.51*x + .03)) / (x*(2.43*x + .59) + .14), 0., 1.); }
    // 逆光的眩光：窗外亮處往四周暈開（兩圈取樣），再加一層整片的霧光，強度慢慢呼吸，像眼睛被光晃到
    vec3 glare(float j){
      vec3 bl = vec3(0.), veil = vec3(0.);
      for (int i = 0; i < 20; i++){
        float fi = float(i), rr = (fi + .5) / 20., a = j * 6.2832 + fi * 2.3999;
        vec2 o = vec2(cos(a) / uAsp, sin(a)) * (.015 + .16 * rr * rr);
        vec3 s = texture2D(tScene, vUv + o).rgb * (1. - step(-0.3, wz(vUv + o)));   // 只有窗外的亮處會暈開
        bl += max(s * uExp * uOut - .7, 0.) * (1.15 - rr);
        veil += s;
      }
      veil = mix(veil, vec3(dot(veil, vec3(.299, .587, .114))), .6);
      return bl / 20. * 1.4 + veil / 20. * .3;
    }
    void main(){
      vec3 c = texture2D(tScene, vUv).rgb;
      c *= ssao();
      // 室內偏灰暗：近處（窗框以內）降低飽和度、壓暗一點
      float inK = smoothstep(-0.45, -0.2, wz(vUv));
      c = mix(c, vec3(dot(c, vec3(.299, .587, .114))), .5 * inK) * mix(uOut, .6, inK);   // 窗外過曝一點、室內壓暗
      float br = 1. + .18 * sin(uT * .37) + .08 * sin(uT * 1.13);
      c += glare(bayer4(gl_FragCoord.xy)) * uGlare * br;
      c += uFlash * vec3(.75, .8, 1.);                       // 閃電
      vec2 q = vUv - .5; c *= 1. - dot(q, q) * .55;            // 鏡頭暗角：室內更暗、窗外更亮
      // 網點被空氣輕輕推動（與吊扇相同），下雨時多一點閃動
      vec2 fp = gl_FragCoord.xy / 70.;
      vec2 off = (vec2(bn(fp + vec2(uT * .03, uT * .01)), bn(fp * 1.3 + vec2(5.2, uT * .024))) - .5) * (3. + 3. * uRain);
      float b = bayer4(gl_FragCoord.xy + floor(off));
      b = fract(b + (bn(gl_FragCoord.xy * .12 + vec2(uT * .25, -uT * .18)) - .5) * (.08 + .1 * uRain));
      // 只用自然色：曝光 → ACES → sRGB → 每個色版用 4×4 Bayer 網點量化成 7 階
      vec3 g = pow(aces(c * uExp), vec3(1./2.2));
      gl_FragColor = vec4(clamp(floor(g * 6. + b) / 6., 0., 1.), 1.);
    }`,
  depthTest:false, depthWrite:false
});
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), post));

let RWID = 4, RHGT = 4, SCALE = 3;
function resize(){
  const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 3), DW = W*dpr, DH = H*dpr;
  SCALE = Math.max(2, Math.round(Math.max(DW, DH) / (BASE_H*16/9)));
  RWID = Math.ceil(DW / SCALE); RHGT = Math.ceil(DH / SCALE);
  renderer.setSize(RWID, RHGT, false);
  canvas.style.width = RWID*SCALE/dpr + 'px'; canvas.style.height = RHGT*SCALE/dpr + 'px';
  rt.setSize(RWID, RHGT); rt.depthTexture.image.width = RWID; rt.depthTexture.image.height = RHGT;
  camera.aspect = RWID / RHGT; post.uniforms.uAsp.value = camera.aspect;
  // 橫式垂直視角 60°；直式加廣，讓整面窗放得進來
  const a = camera.aspect;
  camera.fov = a >= 1 ? 64 : Math.min(98, 2*THREE.MathUtils.radToDeg(Math.atan(Math.tan(THREE.MathUtils.degToRad(32))*Math.max(1, 1.3/a)*0.9)));
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ---------- 材質：粗糙的 PBR（窗口的面光源才照得到），真實的反照率 ---------- */
const std = (hex, o = {}) => new THREE.MeshStandardMaterial({ color: hex, roughness: 0.92, metalness: 0, flatShading: true, ...o });
const M = {
  wall: std(0xd9d5cc), ceil: std(0xe4e1da), floor: std(0x6b5442),
  alu: std(0xd3d8d2, { roughness: 0.5, metalness: 0.25 }), aluDark: std(0x9aa29c, { roughness: 0.5, metalness: 0.3 }),
  marble: new THREE.MeshStandardMaterial({ color: 0xb4b5b4, roughness: 0.5, metalness: 0 }),   // 窗台大理石：亮得照出窗外
  table: new THREE.MeshStandardMaterial({ color: 0x1f1813, roughness: 0.55, metalness: 0 }),     // 深色桌面：反射整片窗光
  asphalt: std(0x45464a, { roughness: 0.95, flatShading: false }), mark: std(0xe8e6de), yellow: std(0xe0b326), red: std(0xb4433a),
  curb: std(0xa9a69e), concrete: std(0x9d9a92), pole: std(0x8e8d88), dark: std(0x2a2a2c), glassCar: std(0x1d2328, { roughness: 0.25, metalness: 0.4 }),
  bark: std(0x6b5a4a), barkGrey: std(0x7d766b), root: std(0x4f3a2e), steel: std(0xc2c4c4, { roughness: 0.4, metalness: 0.6 }),
};
const box = (w,h,d,mat,x,y,z, shadow = true) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); m.castShadow = m.receiveShadow = shadow; scene.add(m); return m; };
const canvasTex = (cv, srgb = true) => { const t = new THREE.CanvasTexture(cv); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; t.anisotropy = 4; return t; };
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
// 夜裡會亮的材質（住家窗戶、招牌、路燈、車燈），強度跟著天色走
const NIGHT_GLOW = [];

/* ---------- 房間 ---------- */
box(RX*2+WT*2, WT, RZ1+WT, M.floor, 0, -WT/2, RZ1/2);
box(RX*2+WT*2, WT, RZ1+WT, M.ceil, 0, RH+WT/2, RZ1/2);
box(WT, RH+WT*2, RZ1+WT, M.wall, -RX-WT/2, RH/2, RZ1/2);
box(WT, RH+WT*2, RZ1+WT, M.wall, RX+WT/2, RH/2, RZ1/2);
box(RX*2+WT*2, RH+WT*2, WT, M.wall, 0, RH/2, RZ1+WT/2);
// 窗牆：四塊圍出窗洞
box(RX*2+WT*2, WIN.y0+WT, WT, M.wall, 0, (WIN.y0-WT)/2, -WT/2);
box(RX*2+WT*2, RH-WIN.y1+WT, WT, M.wall, 0, (RH+WT+WIN.y1)/2, -WT/2);
box(WIN.x0+RX+WT, WIN.y1-WIN.y0, WT, M.wall, (-RX-WT+WIN.x0)/2, (WIN.y0+WIN.y1)/2, -WT/2);
box(RX+WT-WIN.x1, WIN.y1-WIN.y0, WT, M.wall, (WIN.x1+RX+WT)/2, (WIN.y0+WIN.y1)/2, -WT/2);
// 樓下與樓上：讓整棟樓的影子落在街上
box(30, -GROUND - WT, 14, M.concrete, 0, (GROUND - WT)/2, 7 - 0.3);   // 頂面停在樓板下，不和地板同一平面（原本會互相搶深度而閃爍）
box(30, 6, 14, M.concrete, 0, RH + WT + 3, 7 - 0.3);
// 天花板收邊、踢腳板
box(RX*2, 0.06, 0.05, M.wall, 0, RH-0.03, 0.025); box(RX*2, 0.09, 0.02, M.wall, 0, 0.045, 0.01);

/* ---------- 窗：照使用者的圖一（吊扇房間那扇）。白色鋁框，下段兩扇推拉窗，上段兩格氣窗（左格往外推開），窗外一層寬大的鐵窗 ---------- */
{
  const fr = (w,h,d,x,y,z,m = M.alu) => box(w,h,d,m,x,y,z);
  const W = WIN.x1 - WIN.x0, H = WIN.y1 - WIN.y0, ym = (WIN.y0 + WIN.y1)/2;
  fr(W, 0.05, 0.1, 0, WIN.y0 + 0.025, FZ); fr(W, 0.05, 0.1, 0, WIN.y1 - 0.025, FZ);
  fr(0.05, H, 0.1, WIN.x0 + 0.025, ym, FZ); fr(0.05, H, 0.1, WIN.x1 - 0.025, ym, FZ);
  fr(W, 0.045, 0.08, 0, TRANSOM, FZ);                                         // 氣窗橫料
  fr(0.035, WIN.y1 - TRANSOM, 0.035, 0, (TRANSOM + WIN.y1)/2, FZ);            // 氣窗中間直料
  // 推拉窗：兩扇各自的窗框，左扇在內軌、右扇在外軌，在中間交疊
  const sash = (x0, x1, z) => {
    const yb = WIN.y0 + 0.05, yt = TRANSOM - 0.025, ys = (yb + yt)/2;
    fr(x1-x0, 0.05, 0.04, (x0+x1)/2, yb + 0.025, z); fr(x1-x0, 0.05, 0.04, (x0+x1)/2, yt - 0.025, z);
    fr(0.05, yt-yb, 0.04, x0 + 0.025, ys, z); fr(0.05, yt-yb, 0.04, x1 - 0.025, ys, z);
    box(0.02, 0.12, 0.03, M.aluDark, x1 - 0.05, ys, z + 0.03);                // 勾鎖
  };
  sash(WIN.x0 + 0.05, 0.04, FZ + 0.03);
  sash(WIN.x0 + 0.1, 0.07, FZ - 0.03);   // 右扇整個推到左邊，右半邊打開（使用者要窗戶打開）
  // 窗台：大理石，從窗框伸進室內一點
  box(W + 0.3, 0.018, 0.2, M.marble, 0, WIN.y0 - 0.009, -0.02);   // 薄薄一片，邊緣只有 1.8 公分
}
// 往外推開的那格氣窗（左格），上緣鉸鏈、下緣往外傾約 24°
const AWN = new THREE.Group(); AWN.position.set((WIN.x0 + 0.02)/2, WIN.y1 - 0.05, FZ - 0.02); AWN.rotation.x = 0.42; scene.add(AWN);
{
  const w = -WIN.x0 - 0.08, h = WIN.y1 - TRANSOM - 0.08;
  for (const [ww, hh, x, y] of [[w, 0.04, 0, -0.02], [w, 0.04, 0, -h + 0.02], [0.04, h, -w/2 + 0.02, -h/2], [0.04, h, w/2 - 0.02, -h/2]]){
    const m = new THREE.Mesh(new THREE.BoxGeometry(ww, hh, 0.035), M.alu); m.position.set(x, y, 0); m.castShadow = true; AWN.add(m);
  }

/* ---------- 窗玻璃：幾乎透明，一點灰塵；下雨時佈滿水珠，有的順著玻璃滑下來 ---------- */
const glassMat = new THREE.ShaderMaterial({
  uniforms:{ uT:{ value: 0 }, uRain:{ value: 0 }, uSky:{ value: new THREE.Color(1,1,1) } },
  vertexShader:`varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader:`
    uniform float uT, uRain; uniform vec3 uSky; varying vec3 vW;
    float h1(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5); }
    float h2(vec2 p){ return fract(sin(dot(p, vec2(269.5, 183.3))) * 43758.5); }
    void main(){
      vec2 p = vW.xy;
      float a = 0.035 + 0.02 * h1(floor(p * 9.));             // 灰塵、手印般的淡淡霧面
      vec3 col = uSky * 0.9;
      // 靜止的水珠
      vec2 g = p / 0.045, id = floor(g), f = fract(g) - .5;
      float r = h1(id), r2 = h2(id);
      vec2 c = (vec2(h2(id + 3.1), h1(id + 7.7)) - .5) * .5;
      float rad = mix(.12, .32, r2);
      float d = length((f - c) * vec2(1., .85));
      float on = step(1. - uRain * .75, r);
      float drop = on * (1. - smoothstep(rad - .08, rad, d));
      // 往下滑的水珠和後面拖著的水痕
      float cx = p.x / 0.11, col_ = floor(cx), fx = fract(cx) - .5;
      float sp = h1(vec2(col_, 1.)), live = step(1. - uRain * .55, h2(vec2(col_, 4.)));
      float yh = ${WIN.y1.toFixed(2)} - mod(uT * (0.05 + 0.12*sp) + sp * 9., 2.6);
      float wob = sin(p.y * 13. + col_) * .08;
      float head = 1. - smoothstep(.1, .2, length(vec2((fx - wob) * 1.2, (p.y - yh) / 0.11 * 1.3)));
      float trail = (1. - smoothstep(.03, .08, abs(fx - wob))) * step(yh, p.y) * exp(-(p.y - yh) * 2.2) * .55;
      float wet = (head + trail) * live;
      float W = clamp(drop + wet, 0., 1.);

      vec3 dc = mix(col * .35, col * 1.4 + .15, (1. - smoothstep(-.2, 0., (f - c).y)) * (1. - smoothstep(rad*.4, rad, d)) * on);

    }`,
  transparent:true, depthWrite:false, side:THREE.DoubleSide
});

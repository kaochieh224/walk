<title>An endless coast</title>
<meta property="og:title" content="An endless coast">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* 介面：編輯排版風格。Instrument Serif（正體＋斜體），字一律白色，細線分隔，不加卡片 */
:root{
  --ink:#19150c;
  --ui:#ffffff;
  --ui-dim:rgba(255,255,255,.62);
  --rule:rgba(255,255,255,.45);
  --serif:"Instrument Serif","Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--ui);font-family:var(--serif)}
#c{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;cursor:crosshair}
.hud{position:fixed;left:0;right:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-inline:28px;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hud.bottom{bottom:0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.dist{display:flex;flex-direction:column;gap:6px}
.dist .num{font-size:56px;line-height:.9;font-style:italic;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dist .num em{font-size:24px;margin-left:6px;font-style:italic;color:var(--ui-dim)}
.dist small{font-size:13px;letter-spacing:.24em;color:var(--ui-dim);border-top:1px solid var(--rule);padding-top:6px;min-width:150px}
.keys{display:flex;flex-direction:column;align-items:stretch;gap:2px;font-size:16px;line-height:1.35}
.keys .row,button.k{display:grid;grid-template-columns:4em 1fr;column-gap:14px;align-items:center;text-align:left}
.keys b{font-weight:400;letter-spacing:.14em;font-size:12px;text-align:right;color:var(--ui-dim)}
.keys i{font-style:italic}
.keys .off{color:var(--ui-dim)}
button.k{pointer-events:auto;font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-shadow:inherit}
button.k:hover i{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
button.k:focus-visible{outline:1px solid var(--ui);outline-offset:2px}
#uiBtn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px));font:inherit;font-style:italic;font-size:16px;color:var(--ui);background:none;border:0;border-bottom:1px solid var(--rule);padding:6px 0 3px;cursor:pointer;text-shadow:0 1px 12px rgba(0,0,0,.35);opacity:.85;-webkit-tap-highlight-color:transparent}
#uiBtn:hover{opacity:1}
#uiBtn:focus-visible{outline:1px solid var(--ui);outline-offset:4px}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:0 28px calc(56px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(10,9,6,.78),rgba(10,9,6,.25) 50%,rgba(10,9,6,0) 75%);transition:opacity 1.6s}
#intro.gone{opacity:0;pointer-events:none}
#intro .kicker{font-size:13px;letter-spacing:.32em;color:var(--ui-dim);margin:0 0 10px}
#intro h1{margin:0;font-weight:400;font-style:italic;font-size:clamp(56px,10vw,150px);line-height:.9;letter-spacing:-.02em}
#intro .rule{width:min(520px,80vw);height:1px;background:var(--rule);margin:24px 0 20px}
#intro p{margin:0 0 22px;max-width:28em;font-size:clamp(18px,2.2vw,24px);line-height:1.3;font-style:italic;color:var(--ui-dim)}
#start{font:inherit;font-size:22px;color:var(--ui);background:none;border:0;border-bottom:1px solid var(--ui);padding:0 0 4px;cursor:pointer;letter-spacing:.02em}
#start span{display:inline-block;transition:transform .3s}
#start:hover span{transform:translateX(6px)}
#start:focus-visible{outline:1px solid var(--ui);outline-offset:6px}
@media (max-width:560px){.dist .num{font-size:40px}.dist small{min-width:0}.hud{padding-inline:16px;gap:12px}#intro{padding-inline:16px}.keys{font-size:15px;row-gap:0}#uiBtn{right:calc(16px + env(safe-area-inset-right,0px))}}
@media (hover:none){.keys{gap:8px;font-size:19px;align-items:flex-end}.keys .row,.keys b{display:none}button.k{display:flex;justify-content:center;min-width:132px;min-height:46px;padding:0 18px;box-sizing:border-box;border:1px solid var(--rule);background:rgba(10,9,6,.28)}button.k:active{background:rgba(255,255,255,.18)}#uiBtn{font-size:18px;min-height:44px;padding:0 16px;border:1px solid var(--rule);background:rgba(10,9,6,.28);touch-action:manipulation}}
@media (prefers-reduced-motion:reduce){#intro{transition:none}#start span{transition:none}}
</style>

<canvas id="c" aria-label="Beach walk"></canvas>
<div class="hud bottom" id="hud" hidden>
  <div class="dist"><div class="num"><span id="meters">0</span><em>m</em></div><small id="seed" hidden></small></div>
  <div class="keys" id="keys"></div>
</div>
<button id="uiBtn" type="button" hidden>Hide UI</button>
<div id="intro">
  <h1>An endless coast</h1>
  <div class="rule"></div>
  <button id="start" type="button">Begin walking <span>&rarr;</span></button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------- 參數 ---------- */
const PALS = [
  { name:'黃昏', en:'DUSK', pal:['#19150c','#3c3e2d','#57473f','#63648c','#7c99e4'], accent:'#6f6d45', glow:'#4fc4bb', sun:1.0, glow:0.12, rain:0 },   // 原分析影片
  { name:'雨夜', en:'RAIN', pal:['#0e181e','#1b2b34','#2e434d','#52656c','#8aa2aa'], accent:'#7a6238', glow:'#6fd8b0', sun:0.8, glow:0.35, rain:1 },   // 參考影片一：雨中林地
  { name:'藍夜', en:'NIGHT', pal:['#14141f','#2a2d44','#3b3d70','#5557b8','#8285f0'], accent:'#66664a', glow:'#9f8cff', sun:0.75, glow:0.6, rain:0 },   // 參考影片二：藍紫夜景、腳下光暈
  { name:'潛行者', en:'STALKER', pal:['#161a15','#363d33','#5f6a5c','#97a28f','#cfd6c4'], accent:'#6e6844', glow:'#a7b8a0', sun:0.85, glow:0.25, rain:0 },   // 塔可夫斯基《潛行者》：褪色的灰綠、霧白高光
];
const toVec = h => { const c = new THREE.Color(); c.setStyle(h, THREE.LinearSRGBColorSpace); return new THREE.Vector3(c.r, c.g, c.b); };
const PAL = PALS[0].pal;
const BASE_H = 540;            // 內部解析度（短邊約 400 實體像素）
const CH = 48;                 // 每段地形長度（公尺）
const WALK = 1.55, RUN = 3.2;  // 行走速度

/* ---------- 共用數學（JS 與 GLSL 必須一致） ---------- */
// 海岸線：多組不成倍數的正弦疊加，看起來不規則；整體往海那側退，沙灘更寬
// 隨機種子：決定海岸線形狀、岬角、廢墟密度與沿途天氣。網址加 #s12345 可重現同一片海岸，按 N 換一個
let SEED = (() => { const m = location.hash.match(/^#s(\d{1,6})$/); return m ? +m[1] : Math.floor(Math.random()*1e5); })();
const SP = [0,0,0,0,0,0,1,1];   // 0-5 相位、6 大彎幅度、7 崖線起伏
function seedParams(){ const r = mulberry(SEED*7 + 3); for (let i=0;i<6;i++) SP[i] = r()*6.2832; SP[6] = 0.5 + r()*1.1; SP[7] = 0.6 + r()*0.9; }
const shoreZ = x => 3*Math.sin(x*0.031+SP[0]) + 1.6*Math.sin(x*0.077+SP[1]) + 5*SP[6]*Math.sin(x*0.0123+SP[2]) + 2.4*Math.sin(x*0.0191+SP[3])*Math.sin(x*0.0047+SP[4]) + 51;
const cliffZ = x => -52 +   // 崖線往內陸退，沙灘更寬闊
  5*SP[7]*Math.sin(x*0.018+SP[5]) + 2*Math.sin(x*0.05+SP[1]);
const swash  = (x,t) => Math.pow(0.5+0.5*Math.sin(t*0.5 + x*0.02 + 0.8*Math.sin(t*0.13 + x*0.004)), 1.6);
// 浪能湧上來多遠也隨時間和地點起伏（3.5～8.5 公尺）
const reach  = (x,t) => 3.5 + 5*(0.5 + 0.5*Math.sin(t*0.061 + x*0.0083 + 1.7*Math.sin(x*0.0021 + SP[5])));
let REC = 0;   // 末日事件「大退潮」：海水往外退的距離（公尺）
const front  = (x,t) => shoreZ(x) - 0.5 - reach(x,t)*swash(x,t) + REC;
const smooth = (a,b,v) => { const t = Math.min(1, Math.max(0, (v-a)/(b-a))); return t*t*(3-2*t); };
function hash2(x,y){ let h = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263); h = Math.imul(h ^ (h>>>13), 1274126177); return ((h ^ (h>>>16)) >>> 0) / 4294967296; }
function vn(x,y){ const ix=Math.floor(x), iy=Math.floor(y); let fx=x-ix, fy=y-iy; fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy), b=hash2(ix+1,iy), c=hash2(ix,iy+1), d=hash2(ix+1,iy+1);
  return (a+(b-a)*fx) + ((c+(d-c)*fx) - (a+(b-a)*fx))*fy; }
function mulberry(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }

function height(x,z){
  const z0 = shoreZ(x); let y;
  if (z > z0) y = -(z - z0)*0.07;
  else {
    const d = z0 - 10 - z;
    y = d > 0 ? Math.min(d*0.045, 1.1) + (vn(x*0.13, z*0.13)-0.5)*0.7*Math.min(d/6,1) : 0;
  }
  const k = cliffZ(x) - z;
  if (k > 0) y += 1.3*smooth(0,1.6,k) + 2.2*smooth(6,8,k) + 4.5*smooth(14,16.5,k) + 9*smooth(24,29,k) + 6*smooth(36,40,k);
  return y;
}

const GLSL = /* glsl */`
uniform float uTime; uniform vec4 uSP; uniform vec4 uSQ;
varying vec3 vWPos;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
float shoreZ(float x){ return 3.0*sin(x*0.031+uSP.x) + 1.6*sin(x*0.077+uSP.y) + 5.0*uSQ.z*sin(x*0.0123+uSP.z) + 2.4*sin(x*0.0191+uSP.w)*sin(x*0.0047+uSQ.x) + 51.0; }
float swash(float x,float t){ return pow(0.5+0.5*sin(t*0.5 + x*0.02 + 0.8*sin(t*0.13 + x*0.004)), 1.6); }
float reach(float x,float t){ return 3.5 + 5.0*(0.5 + 0.5*sin(t*0.061 + x*0.0083 + 1.7*sin(x*0.0021 + uSQ.y))); }
float frontZ(float x,float t){ return shoreZ(x) - 0.5 - reach(x,t)*swash(x,t) + uSQ.w; }
float cloudShade(vec3 w){
  vec2 p = w.xz*0.022 + vec2(uTime*0.018, uTime*0.007);
  float n = vnoise(p)*0.55 + vnoise(p*2.3+7.)*0.3 + vnoise(p*5.1+3.)*0.15;
  return mix(0.6, 1.12, smoothstep(0.32, 0.72, n));
}
`;

/* ---------- 渲染器：低解析 render target → 調色盤網點 ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
const rt = new THREE.WebGLRenderTarget(4, 4, { minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter, type:THREE.HalfFloatType });
rt.depthTexture = new THREE.DepthTexture(4, 4); rt.depthTexture.type = THREE.UnsignedIntType;   // 給輪廓線判斷前後

const U = { uTime:{ value:0 }, uSP:{ value: new THREE.Vector4() }, uSQ:{ value: new THREE.Vector4() } };
function syncSeedUniforms(){ U.uSP.value.set(SP[0], SP[1], SP[2], SP[3]); U.uSQ.value.set(SP[4], SP[5], SP[6], REC); }
seedParams(); syncSeedUniforms();
const scene = new THREE.Scene();
const FOG = new THREE.Color(0.46, 0.46, 0.46);
scene.background = FOG.clone();
scene.fog = new THREE.Fog(FOG.clone(), 1e5, 2e5);

const camera = new THREE.PerspectiveCamera(50, 1, 0.08, 1700);
// 鏡頭：人物背後中低角度跟拍（參考 Coldplay〈Yellow〉MV），看得到海平線
let camYaw = 0;   // 人物前進方向（0 = 沿海岸往 +x）
// 鏡位：o = { x, y, z, f:[fx,fz], r:[rx,rz] }，回傳鏡頭位置與注視點（世界座標）
const SHOTS = [
  { id:'TELE', fov:22, k:2.2, w:3,  // 主鏡頭：背後遠距離望遠跟拍（偏海側），長焦把沿岸廢墟壓縮成一整排
    at:o => [o.x - o.f[0]*110 + o.r[0]*15, o.y + 13.5, o.z - o.f[1]*110 + o.r[1]*15,   // 拉遠：110 公尺外
             o.x + o.f[0]*10 + o.r[0]*5, o.y + 3, o.z + o.f[1]*10 + o.r[1]*5] },
];
const cam = { shot: 0, cinema: false,   // 只留 TELE 一個鏡頭，不再自動切換
  next: 14, orbit: 0, orbitT: 0, zoom: 1, zoomT: 1, still: new THREE.Vector3() };
function placeStill(o){ cam.still.set(o.x - o.f[0]*28 + o.r[0]*10, 0, o.z - o.f[1]*28 + o.r[1]*10); cam.still.y = height(cam.still.x, cam.still.z) + 1.7; }
function cutTo(i, o){ cam.shot = i; if (SHOTS[i].still) placeStill(o); cam.snap = true; renderKeys(); }

const post = new THREE.ShaderMaterial({
  uniforms:{
    tScene:{ value: rt.texture }, tDepth:{ value: rt.depthTexture }, res:{ value: new THREE.Vector2(4,4) },
    cn:{ value: 0.08 }, cf:{ value: 1200 }, fogN:{ value: 40 }, fogF:{ value: 430 },
    pal:{ value: PAL.map(toVec) }, accent:{ value: toVec(PALS[0].accent) }, glowC:{ value: toVec(PALS[0].glow) },
    lo:{ value: 0.10 }, hi:{ value: 0.86 }, flash:{ value: 0 }
  },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader:`
    uniform sampler2D tScene; uniform sampler2D tDepth; uniform vec2 res; uniform float cn, cf, fogN, fogF; uniform vec3 pal[5]; uniform vec3 accent; uniform vec3 glowC; uniform float lo, hi, flash; varying vec2 vUv;
    float bayer2(vec2 a){ a=floor(a); return fract(dot(a, vec2(.5, a.y*.75))); }
    float bayer4(vec2 a){ return bayer2(.5*a)*.25 + bayer2(a); }
    float lin(vec2 uv){ float z = texture2D(tDepth, uv).x*2.-1.; return 2.*cn*cf/(cf+cn - z*(cf-cn)); }
    float lum(vec3 c){ return pow(max(dot(c, vec3(.299,.587,.114)), 0.), 1./2.2); }
    void main(){
      vec4 c4 = texture2D(tScene, vUv);
      vec3 c = c4.rgb;
      float l = pow(max(dot(c, vec3(.299,.587,.114)), 0.), 1./2.2);
      float v = clamp((l-lo)/(hi-lo), 0., 1.) * 4.;
      float i = clamp(floor(v + bayer4(gl_FragCoord.xy)), 0., 4.);
      vec3 o = i < .5 ? pal[0] : i < 1.5 ? pal[1] : i < 2.5 ? pal[2] : i < 3.5 ? pal[3] : pal[4];
      if (c.r - c.b > 0.12) o = accent;
      gl_FragColor = vec4(o, 1.);
    }`,
  depthTest:false, depthWrite:false
});
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), post));

let RW = 4, RH = 4, SCALE = 3;
function resize(){
  const W = innerWidth, H = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 3), DW = W*dpr, DH = H*dpr;
  SCALE = Math.max(2, Math.round(Math.max(DW, DH) / (BASE_H*16/9)));   // 以長邊為準，手機和桌機的點陣顆粒一樣大
  RW = Math.ceil(DW / SCALE); RH = Math.ceil(DH / SCALE);
  renderer.setSize(RW, RH, false);
  canvas.style.width = RW*SCALE/dpr + 'px'; canvas.style.height = RH*SCALE/dpr + 'px';
  rt.setSize(RW, RH); rt.depthTexture.image.width = RW; rt.depthTexture.image.height = RH; post.uniforms.res.value.set(RW, RH);
  camera.aspect = RW / RH;
  // 直式螢幕時把鏡頭拉遠一點，讓海岸寬度夠看
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ---------- 材質 ---------- */
function patch(mat, wet, struct, ruin){
  mat.customProgramCacheKey = () => 'beach' + (wet ? 'W' : '') + (struct ? 'S' : '') + (ruin ? 'R' : '');   // 不同變體不能共用同一個編譯結果
  mat.onBeforeCompile = s => {
    s.uniforms.uTime = U.uTime; s.uniforms.uSP = U.uSP; s.uniforms.uSQ = U.uSQ;
    s.vertexShader = 'varying vec3 vWPos;\nvarying vec3 vLPos;\n' + (ruin ? 'attribute float aWall;\nvarying float vWall;\nvarying vec3 vLN;\n' : '') + s.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      vLPos = transformed;${ruin ? ' vWall = aWall; vLN = normal;' : ''}
      vec4 wp_ = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        wp_ = instanceMatrix * wp_;
      #endif
      vWPos = (modelMatrix * wp_).xyz;`);
    s.fragmentShader = GLSL + 'varying vec3 vLPos;\n' + (ruin ? 'varying float vWall;\nvarying vec3 vLN;\n' : '') + s.fragmentShader.replace('#include <opaque_fragment>', `
      outgoingLight *= cloudShade(vWPos);
      ${ruin ? `
      // 廢墟質感：用大樓自己的座標畫髒污、雨水垂流、樓板下的煙燻、剝落斑塊，倒塌時貼圖跟著走
      vec2 fp = vec2(vLPos.x + vLPos.z, vLPos.y);
      float blot = vnoise(fp*0.05 + 7.0)*0.6 + vnoise(fp*0.16 + 2.0)*0.4;
      float streak = vnoise(vec2(fp.x*0.8, fp.y*0.035)) * vnoise(vec2(fp.x*0.23 + 5.0, fp.y*0.02));
      float soot = smoothstep(0.0, 1.4, mod(vLPos.y + 0.2, 3.4));
      float spall = smoothstep(0.7, 0.78, vnoise(fp*0.45 + 11.0));
      float grit = hash12(floor(fp*2.0));
      float gr = mix(0.38, 1.3, blot) * (1.0 - 0.6*streak) * mix(0.65, 1.0, soot) * (1.0 - 0.4*spall) * (0.85 + 0.3*grit);
      gr *= mix(0.6, 1.0, smoothstep(1.0, 14.0, vLPos.y));   // 底部泡水變暗
      // 實牆上的窗洞：每 3 公尺一扇、每層一排；有的窗被炸大、有的整扇不見，窗內是暗的
      if (vWall > 1.5) gr = 0.2 + 0.12*grit;   // 鋼骨、鋼筋：深色鏽鐵
      else if (vWall > 0.5 && abs(vLN.y) < 0.5){
        float wu = abs(vLN.x) > abs(vLN.z) ? vLPos.z : vLPos.x;
        vec2 cell = vec2(floor(wu/3.0), floor(vLPos.y/3.4));
        float hc = hash12(cell + 3.7), fu = fract(wu/3.0), fv = fract(vLPos.y/3.4);
        float gw = hc > 0.85 ? 0.42 : 0.28, gt = hc > 0.85 ? 0.15 : 0.3;   // 15% 的窗破成大洞
        float win = step(0.5 - gw, fu) * step(fu, 0.5 + gw) * step(gt, fv) * step(fv, 0.84);
        win *= step(0.06, hash12(cell + 9.1));
        gr *= mix(1.0, 0.13 + 0.1*hash12(cell), win);
      }
      outgoingLight *= gr;` : ''}
      ${wet ? `
      float zf = vWPos.z - (shoreZ(vWPos.x) - 9.5);
      outgoingLight *= mix(1.0, 0.7, smoothstep(0.0, 1.2, zf));
      float sheen = smoothstep(1.6, 0.0, frontZ(vWPos.x, uTime) - vWPos.z) * step(vWPos.z, frontZ(vWPos.x, uTime));

function blocked(x, z){

  return null;
}
function step(dt){
  const t = U.uTime.value;

    {
      // 沿著浪線走，偶爾讓浪打到腳邊
      const tz = shoreZ(st.x + 4) - 3.2 + 2.2*Math.sin(st.x*0.045) ;

        const c = blocked(st.x + look, st.z + mz*look*0.5);

      }
    }
  }

    mx /= l; mz /= l;
    let nx = st.x + mx*speed*dt, nz = st.z + mz*speed*dt;
    for (const c of colliders){ const dx = nx-c.x, dz = nz-c.z, d = Math.hypot(dx,dz); if (d < c.r && d > 1e-4){ nx = c.x + dx/d*c.r; nz = c.z + dz/d*c.r; } }
    nz = THREE.MathUtils.clamp(nz, cliffZ(nx) + 1.2, shoreZ(nx) + 4);
    const moved = Math.hypot(nx - st.x, nz - st.z);
    st.x = nx; st.z = nz;
    if (st.x > st.maxX){ st.dist += st.x - st.maxX; st.maxX = st.x; }
    const targetYaw = Math.atan2(-mz, mx);
    let dy = targetYaw - st.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); st.yaw += dy * Math.min(1, dt*8);

function frame(){

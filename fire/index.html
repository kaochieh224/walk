<style>
/* 介面：與〈An endless coast〉〈A slow afternoon〉〈By the window〉同一套。Instrument Serif，字一律白色，細線分隔，不加卡片 */
:root{
  --ink:#0d0b08;
  --ui:#ffffff;
  --ui-dim:rgba(255,255,255,.62);

}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--ui);font-family:var(--serif)}
#c{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.hud{position:fixed;left:0;right:0;pointer-events:none;display:flex;justify-content:flex-end;align-items:flex-end;gap:24px;padding-inline:28px;text-shadow:0 0 2px rgba(0,0,0,.45),0 1px 12px rgba(0,0,0,.5)}
.hud.bottom{bottom:0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.keys{display:flex;flex-direction:column;align-items:stretch;gap:2px;font-size:16px;line-height:1.35}
button.k{display:grid;grid-template-columns:2em 1fr;column-gap:14px;align-items:center;text-align:left}
.keys b{font-weight:400;letter-spacing:.14em;font-size:12px;text-align:right;color:var(--ui-dim)}
.keys i{font-style:italic}
.keys .off{color:var(--ui-dim)}
button.k{pointer-events:auto;font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-shadow:inherit}
button.k:hover i{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
button.k:focus-visible{outline:1px solid var(--ui);outline-offset:2px}
#uiBtn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px));font:inherit;font-style:italic;font-size:16px;color:var(--ui);background:none;border:0;border-bottom:1px solid var(--rule);padding:6px 0 3px;cursor:pointer;text-shadow:0 0 2px rgba(0,0,0,.45),0 1px 12px rgba(0,0,0,.5);opacity:.85;-webkit-tap-highlight-color:transparent}

#intro{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:0 28px calc(56px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(10,9,6,.78),rgba(10,9,6,.25) 50%,rgba(10,9,6,0) 75%);transition:opacity 1.6s}

@media (max-width:560px){.hud{padding-inline:16px;gap:12px}#intro{padding-inline:16px}.keys{font-size:15px}#uiBtn{right:calc(16px + env(safe-area-inset-right,0px))}}
@media (hover:none){.keys{gap:8px;font-size:19px;align-items:flex-end}.keys b{display:none}button.k{display:flex;justify-content:center;min-width:132px;min-height:46px;padding:0 18px;box-sizing:border-box;border:1px solid var(--rule);background:rgba(10,9,6,.28)}button.k:active{background:rgba(255,255,255,.18)}#uiBtn{font-size:18px;min-height:44px;padding:0 16px;border:1px solid var(--rule);background:rgba(10,9,6,.28);touch-action:manipulation}}
@media (prefers-reduced-motion:reduce){#intro{transition:none}#start span{transition:none}}
</style>

<canvas id="c" aria-label="Standing in open wild grassland at dusk, looking at a lone tree burning on a small hill"></canvas>

</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------- 參數 ---------- */
const BASE_H = 540;   // 內部解析度與其他場景相同：點陣顆粒一樣大
// 荒野（公尺）：站在原點往 -z 看；前方 36 公尺有一座小土坡，坡頂一棵樹正在燒
const MX = 3, MZ = -36;            // 土坡中心
const EYE_H = 1.62;                // 眼睛高度
const WALK_MAX = 19;               // 最多往前走 19 公尺（再靠近太燙）
const HOME = { yaw: -0.07, pitch: 0.07 };

/* ---------- 共用噪聲與亂數 ---------- */
function mulberry(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
const R = mulberry(20261014);
const ss = THREE.MathUtils.smoothstep, lerp = THREE.MathUtils.lerp, clamp = THREE.MathUtils.clamp;
const hash2 = (x, z) => { const s = Math.sin(x*127.1 + z*311.7)*43758.5453; return s - Math.floor(s); };
function vn(x, z){ const ix = Math.floor(x), iz = Math.floor(z); let fx = x - ix, fz = z - iz; fx = fx*fx*(3-2*fx); fz = fz*fz*(3-2*fz);
  const a = hash2(ix, iz), b = hash2(ix+1, iz), c = hash2(ix, iz+1), d = hash2(ix+1, iz+1); return a + (b-a)*fx + (c-a)*fz + (a-b-c+d)*fx*fz; }
const fbm = (x, z) => vn(x, z)*0.5 + vn(x*2.03 + 5.1, z*2.03 - 3.7)*0.25 + vn(x*4.1 - 9.3, z*4.1 + 1.3)*0.125 + vn(x*8.3 + 2.2, z*8.3 + 7.7)*0.0625;

// 地形高度：緩緩起伏的草原、前方的小土坡、四周遠處慢慢升起的丘陵與山
function H(x, z){
  const d = Math.hypot(x - MX, z - MZ);
  let h = (fbm(x*0.016 + 3, z*0.016 + 7) - 0.47)*3.4;
  h += 4.4*Math.exp(-Math.pow(d/12.5, 2.2));
  h += (fbm(x*0.14, z*0.14) - 0.47)*0.3;
  const r = Math.hypot(x*0.8, z + 70);
  h += ss(r, 170, 720) * (18 + 95*fbm(x*0.005 + 20, z*0.005 - 5));
  h -= 0.9*Math.exp(-(x*x + z*z)/900);   // 站的地方略低一點，看土坡是微微仰角
  return h;
}
const TB = new THREE.Vector3(MX, H(MX, MZ) - 0.15, MZ);   // 樹根

/* ---------- 渲染器：低解析 render target → 自然色 + Bayer 網點（與吊扇、窗邊同一條管線），加上火的熱浪扭曲與光暈 ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
const rt = new THREE.WebGLRenderTarget(4, 4, { minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter, type:THREE.HalfFloatType });

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x6a6a78, 0.0028);
const camera = new THREE.PerspectiveCamera(56, 1, 0.05, 3000);
camera.rotation.order = 'YXZ';

const post = new THREE.ShaderMaterial({
  uniforms:{ tScene:{ value: rt.texture }, uT:{ value: 0 }, uExp:{ value: 1.0 }, uAsp:{ value: 1.78 }, uFire:{ value: new THREE.Vector3() }, uFireR:{ value: new THREE.Vector2(0.1, 0.1) }, uHaze:{ value: 1 }, uFlash:{ value: 0 } },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader:`
    uniform sampler2D tScene; uniform float uT, uExp, uAsp, uHaze, uFlash; uniform vec3 uFire; uniform vec2 uFireR; varying vec2 vUv;
    float bayer2(vec2 a){ a=floor(a); return fract(dot(a, vec2(.5, a.y*.75))); }
    float bayer4(vec2 a){ return bayer2(.5*a)*.25 + bayer2(a); }
    float bh(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5); }
    float bn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(bh(i),bh(i+vec2(1,0)),f.x), mix(bh(i+vec2(0,1)),bh(i+vec2(1,1)),f.x), f.y); }
    vec3 aces(vec3 x){ return clamp((x*(2.51*x + .03)) / (x*(2.43*x + .59) + .14), 0., 1.); }
    void main(){
      vec2 uv = vUv;
      // 熱浪：火焰上方的空氣扭動，越往上越散、越弱
      vec2 d = (uv - uFire.xy) / uFireR;
      float m = uFire.z * exp(-d.x*d.x*.9) * smoothstep(-1.3, -.2, d.y) * smoothstep(3.2, .7, d.y) * uHaze;
      vec2 hp = uv * vec2(uAsp, 1.) * 70.;
      uv += (vec2(bn(hp + vec2(0., -uT*7.)), bn(hp*1.4 + vec2(7.3, -uT*10.))) - .5) * .009 * m;
      vec3 c = texture2D(tScene, uv).rgb * uExp;
      // 火的光暈：亮處往四周暈開
      vec3 bl = vec3(0.);
      float j = bayer4(gl_FragCoord.xy) * 6.2832;
      for (int i = 0; i < 18; i++){
        float fi = float(i), rr = (fi + .5) / 18., a = j + fi * 2.3999;
        vec2 o = vec2(cos(a) / uAsp, sin(a)) * (.006 + .11 * rr * rr);
        vec3 s = texture2D(tScene, uv + o).rgb * uExp;
        bl += max(s - 1.3, 0.) * (1.15 - rr);
      }
      c += bl / 18. * .55;
      c += uFlash * vec3(1., .7, .4);
      vec2 q = vUv - .5; c *= 1. - dot(q, q) * .6;              // 鏡頭暗角
      // 網點被空氣輕輕推動（與其他場景相同）；火附近熱浪讓網點多一點閃動
      vec2 fp = gl_FragCoord.xy / 70.;
      vec2 off = (vec2(bn(fp + vec2(uT * .03, uT * .01)), bn(fp * 1.3 + vec2(5.2, uT * .024))) - .5) * (3. + 4. * m);
      float b = bayer4(gl_FragCoord.xy + floor(off));
      b = fract(b + (bn(gl_FragCoord.xy * .12 + vec2(uT * .25, -uT * .18)) - .5) * (.08 + .12 * m));
      // 只用自然色：曝光 → ACES → sRGB → 每個色版用 4×4 Bayer 網點量化成 7 階
      vec3 g = pow(aces(c), vec3(1./2.2));
      gl_FragColor = vec4(clamp(floor(g * 6. + b) / 6., 0., 1.), 1.);
    }`,
  depthTest:false, depthWrite:false
});
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), post));

// 粒子的大小以 render target 像素算
const U = { t:{ value: 0 }, wind:{ value: 0.5 }, windV:{ value: new THREE.Vector3(1, 0, -0.2) }, scale:{ value: 400 } };
let RWID = 4, RHGT = 4, SCALE = 3;
function resize(){
  const W = innerWidth, H_ = innerHeight, dpr = Math.min(devicePixelRatio || 1, 3), DW = W*dpr, DH = H_*dpr;
  SCALE = Math.max(2, Math.round(Math.max(DW, DH) / (BASE_H*16/9)));
  RWID = Math.ceil(DW / SCALE); RHGT = Math.ceil(DH / SCALE);
  renderer.setSize(RWID, RHGT, false);
  canvas.style.width = RWID*SCALE/dpr + 'px'; canvas.style.height = RHGT*SCALE/dpr + 'px';
  rt.setSize(RWID, RHGT);
  camera.aspect = RWID / RHGT; post.uniforms.uAsp.value = camera.aspect;
  // 橫式垂直視角 56°；直式依 16:9 的水平視角換算，樹和土坡都放得進來
  const a = camera.aspect;
  camera.fov = a >= 1 ? 56 : Math.min(92, 2*THREE.MathUtils.radToDeg(Math.atan(Math.tan(THREE.MathUtils.degToRad(28))*Math.max(1, 1.25/a)*0.85)));
  camera.updateProjectionMatrix();
  U.scale.value = RHGT / (2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
}
addEventListener('resize', resize);

/* ---------- GLSL 小工具 ---------- */
const NOISE3 = `
  float h3(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
  float vn3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
    return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }`;

/* ---------- 地面：近處細網格、遠處粗網格；頂點色畫出乾草、裸土、燒焦的一圈 ---------- */
const C = (h) => new THREE.Color(h);
const COL = { straw: C(0x8c7a4c), straw2: C(0x9a8656), dirt: C(0x6a5841), olive: C(0x6b6a45), char: C(0x15120f), ash: C(0x4c4741), far: C(0x6e6a55) };
const _c = new THREE.Color();
function groundColor(x, z, out){
  const n = fbm(x*0.05 + 11, z*0.05 - 4), n2 = fbm(x*0.21, z*0.21);
  out.copy(COL.straw).lerp(COL.straw2, ss(n2, 0.35, 0.75)).lerp(COL.dirt, ss(n, 0.5, 0.72)*0.9).lerp(COL.olive, ss(n, 0.36, 0.14)*0.7).multiplyScalar(0.85 + 0.3*n2);
  const d = Math.hypot(x - MX, z - MZ) + (fbm(x*0.4, z*0.4) - 0.5)*2.2;
  out.lerp(COL.ash, (1 - ss(d, 6.8, 8.6))*0.85);   // 灰燼的一圈
  out.lerp(COL.char, 1 - ss(d, 4.2, 7.0));          // 燒焦的地
  return out;
}
const groundMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0 });
function terrain(w, d, cx, cz, sx, sz, drop){
  const g = new THREE.PlaneGeometry(w, d, sx, sz).rotateX(-Math.PI/2);
  const p = g.attributes.position, col = new Float32Array(p.count*3);
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i) + cx, z = p.getZ(i) + cz;
    p.setXYZ(i, x, H(x, z) - drop, z);
    groundColor(x, z, _c); if (drop) _c.lerp(COL.far, ss(Math.hypot(x, z + 60), 200, 600)*0.6);
    col[i*3] = _c.r; col[i*3+1] = _c.g; col[i*3+2] = _c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, groundMat); m.receiveShadow = true; scene.add(m); return m;
}
terrain(300, 300, 0, -50, 300, 300, 0);       // 近處：1 公尺一格
terrain(5200, 5200, 0, -60, 260, 260, 0.6);   // 遠處：稍微壓低，被近處蓋住

/* ---------- 乾草：一叢叢三片葉，InstancedMesh，在 shader 裡隨風擺 ---------- */
const GRASS = [];
{
  const geos = [];
  for (let b = 0; b < 5; b++){
    const a = b*1.25 + R()*0.6, ca = Math.cos(a), sa = Math.sin(a), w = 0.03 + R()*0.025, lx = (R() - 0.5)*0.5, lz = (R() - 0.5)*0.5, hh = 0.7 + R()*0.3;
    const P = (u, y, k) => [ca*u + lx*k*k, y*hh, sa*u + lz*k*k];
    const v = [...P(-w, 0, 0), ...P(w, 0, 0), ...P(-w*0.6, 0.5, 0.5), ...P(-w*0.6, 0.5, 0.5), ...P(w, 0, 0), ...P(w*0.6, 0.5, 0.5), ...P(-w*0.6, 0.5, 0.5), ...P(w*0.6, 0.5, 0.5), ...P(0, 1, 1)];
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
    const nrm = []; for (let i = 0; i < 9; i++) nrm.push(sa*0.3, 0.9, -ca*0.3); g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
    geos.push(g);
  }
  const geo = mergeGeometries(geos);
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, side: THREE.DoubleSide });
  mat.onBeforeCompile = sh => {
    sh.uniforms.uT = U.t; sh.uniforms.uW = U.wind; sh.uniforms.uWV = U.windV;
    // 雙面草葉：背面不翻法線（原本背面會變成一片黑）
    sh.fragmentShader = sh.fragmentShader.replace('#include <normal_fragment_begin>', THREE.ShaderChunk.normal_fragment_begin.replace('normal *= faceDirection;', ''));
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uT, uW; uniform vec3 uWV;').replace('#include <begin_vertex>', `#include <begin_vertex>
      { vec3 ip = instanceMatrix[3].xyz; float ph = uT*1.7 - dot(ip.xz, uWV.xz)*.22 + ip.x*.05;
        float k = position.y*position.y, s = (sin(ph)*.55 + sin(ph*2.7 + ip.z)*.2 + .55) * uW;
        vec3 wo = vec3(uWV.x*s*.38, -s*s*.04, uWV.z*s*.38 + cos(ph*1.3)*.05*uW) * k;
        transformed += inverse(mat3(instanceMatrix)) * wo; }`);
  };
  const pts = [];
  const tryAdd = (x, z) => {
    const d = Math.hypot(x - MX, z - MZ); if (d < 6.2) return;
    const n = fbm(x*0.05 + 11, z*0.05 - 4); if (R() < ss(n, 0.5, 0.8)*0.7) return;   // 裸土的地方少草
    pts.push([x, z, d]);
  };
  const GK = matchMedia('(hover: none)').matches ? 0.55 : 1;   // 手機少一點草
  for (let i = 0; i < 64000*GK; i++){ const x = (R() - 0.5)*120 + 2, z = 22 - R()*140; tryAdd(x, z); }       // 近處密
  for (let i = 0; i < 11000*GK; i++){ const x = (R() - 0.5)*280, z = 60 - R()*290; if (Math.abs(x - 2) < 60 && z > -118 && z < 22) continue; tryAdd(x, z); }
  const inst = new THREE.InstancedMesh(geo, mat, pts.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), e = new THREE.Euler();
  for (let i = 0; i < pts.length; i++){
    const [x, z, d] = pts[i], scorch = 1 - ss(d, 6.2, 9.5);
    const hgt = (0.22 + R()*0.42) * (1 - 0.6*scorch) * (0.7 + 0.6*fbm(x*0.1, z*0.1)) * (0.45 + 0.55*ss(Math.hypot(x, z), 2, 14));   // 腳邊的草矮，才看得到前方
    e.set((R() - 0.5)*0.3, R()*Math.PI*2, (R() - 0.5)*0.3); q.setFromEuler(e);
    s.set(1.1 + R()*0.8, hgt, 1.1 + R()*0.8); p.set(x, H(x, z) - 0.05, z);
    inst.setMatrixAt(i, m4.compose(p, q, s));
    _c.setHSL(0.105 + R()*0.04 - (R() < 0.15 ? 0.04 : 0), 0.24 + R()*0.18, 0.22 + R()*0.12);
    _c.lerp(COL.char, scorch*0.85);
    inst.setColorAt(i, _c);
  }
  inst.receiveShadow = true; inst.frustumCulled = false; scene.add(inst); GRASS.push(inst);
}

/* ---------- 石頭、灌木、遠方幾棵孤樹 ---------- */
const std = (hex, o = {}) => new THREE.MeshStandardMaterial({ color: hex, roughness: 0.95, metalness: 0, flatShading: true, ...o });
{
  const rocks = [], shrubs = [], shrubDark = [];
  // 同一個角點用同一個抖動量（依座標雜湊），面才不會裂開
  const jitter = (g, k) => { const p = g.attributes.position, sd = R()*100; for (let i = 0; i < p.count; i++){ const x = p.getX(i), y = p.getY(i), z = p.getZ(i), hh = (o) => hash2(Math.round(x*97) + o + sd, Math.round(y*89) + Math.round(z*83)*0.37) - 0.5; p.setXYZ(i, x*(1 + hh(0)*k), y*(1 + hh(13)*k), z*(1 + hh(29)*k)); } g.computeVertexNormals(); return g; };
  const place = (n, f) => { for (let i = 0, k = 0; i < n && k < n*20; k++){ const x = (R() - 0.5)*200, z = 30 - R()*230; if (Math.hypot(x, z) < 12 || Math.hypot(x - MX, z - MZ) < 8) continue; if (Math.abs(x/(MX) - z/(MZ)) < 0.08 && z < 0 && z > MZ) continue; f(x, z); i++; } };
  place(60, (x, z) => {

    n.connect(f); f.connect(g); g.connect(A.fireG); n.start(t0, Math.random()*3); n.stop(t0 + 0.4);
  } else {
    const o = ac.createOscillator(); o.frequency.setValueAtTime(70, t0); o.frequency.exponentialRampToValueAtTime(32, t0 + 0.4);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.9, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
    o.connect(g); g.connect(A.fireG); o.start(t0); o.stop(t0 + 0.7);
    const n = ac.createBufferSource(); n.buffer = A.brown; const g2 = ac.createGain(); g2.gain.setValueAtTime(0.8, t0); g2.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
    n.connect(g2); g2.connect(A.fireG); n.start(t0, Math.random()*3); n.stop(t0 + 1.3);
    for (let i = 0; i < 10; i++) oneShot(A, A.pops[Math.floor(Math.random()*A.pops.length)], 0.6 + Math.random(), 0.5, A.crackBus, t0 + 0.05 + Math.random()*0.8);
  }
}

/* ---------- 斷枝：一根燒透的枝從樹上折斷，往下翻落到土坡上，落地噴起一陣火星，之後在地上繼續燒 ---------- */
const _qa = new THREE.Quaternion(), _qb = new THREE.Quaternion(), _p0 = new THREE.Vector3(), _p1 = new THREE.Vector3();
for (const f of FALL){
  const hd = new THREE.Vector3(f.dir.x, 0, f.dir.z).normalize();
  const L = 1.4 + R()*0.8, x = TB.x + hd.x*L, z = TB.z + hd.z*L;
  f.end = new THREE.Vector3(x, H(x, z) + 0.18, z);
  // 落地後：枝順著原本的方位躺平，再隨機翻一點
  const flat = new THREE.Vector3(f.dir.x, -0.05, f.dir.z).normalize();
  f.q1 = new THREE.Quaternion().setFromUnitVectors(f.dir, flat).premultiply(new THREE.Quaternion().setFromAxisAngle(flat, (R() - 0.5)*1.6));
  f.state = 'on'; f.t0 = 0; f.gi = 1;
}
function startFall(t){
  const f = FALL.find(f => f.state === 'on'); if (!f) return false;
  f.state = 'falling'; f.t0 = t; st.flare = 1; sfxCrack(0, false);
  BURST.t.value = t; BURST.p.value.copy(f.pivot);
  return true;
}
function updateFalls(t, dt){
  for (const f of FALL){
    const G = f.G;
    if (f.state === 'falling'){
      // 先慢慢垂下（0.9 秒），再加速往下掉（1.1 秒）
      const u = t - f.t0;
      if (u < 0.9){ const e = u/0.9; G.quaternion.setFromAxisAngle(_p0.crossVectors(f.dir, _up).normalize(), -e*e*0.35); G.position.copy(f.pivot); }
      else {
        const e = Math.min(1, (u - 0.9)/1.1), e2 = e*e;
        _qa.setFromAxisAngle(_p0.crossVectors(f.dir, _up).normalize(), -0.35); _qb.slerpQuaternions(_qa, f.q1, Math.pow(e, 1.3)); G.quaternion.copy(_qb);
        G.position.lerpVectors(f.pivot, f.end, e2); G.position.y += Math.sin(e*Math.PI)*0.4;
        if (e >= 1){ f.state = 'down'; f.t0 = t; sfxCrack(0, true); BURST.t.value = t; BURST.p.value.copy(f.end); st.flare = Math.max(st.flare, 0.7); }
      }
      f.gi = 1;
    } else if (f.state === 'down'){
      const u = t - f.t0; G.position.copy(f.end); G.position.y -= Math.min(0.06, u*0.02);
      f.gi = lerp(0.85, 0.3, ss(u, 0, 160));   // 落地後火慢慢變小
    }
    G.updateMatrixWorld(true);
    GRP.mats[f.g].copy(G.matrixWorld); GRP.gi[f.g] = f.gi;
  }
}

/* ---------- 主迴圈 ---------- */
let last = performance.now(); const T0 = last;
const _gc = new THREE.Color(), _zc = new THREE.Color(), _hc = new THREE.Color(), _fp = new THREE.Vector3();
const fire = { flick: 0.5 };
function frame(now){
  const dt = clamp((now - last)/1000, 0, 0.05); last = now;
  const t = (now - T0)/1000; tNow = t;

  // 時間：一天 40 分鐘；「later」用 8 秒快轉到下一個時段
  if (st.hourT){ const u = Math.min(1, (t - st.hourT.t0)/8), e = 0.5 - 0.5*Math.cos(Math.PI*u); st.hour = lerp(st.hourT.from, st.hourT.to, e); if (u >= 1) st.hourT = null; }
  else st.hour += dt * 24 / DAY_LEN;
  const hh = st.hour % 24;
  skyAt(hh); sunAt(hh);
  const night = SKY.night;

  // 風：慢慢起伏，偶爾一陣強風把火壓斜、火星大把大把飛出去
  if (t > st.nextGust){ st.nextGust = t + 25 + R()*50; st.gustT = t; }
  st.gust = st.gustT ? Math.max(0, Math.sin(Math.min(1, (t - st.gustT)/7)*Math.PI)) : 0;
  const wind = 0.45 + 0.25*Math.sin(t*0.11)*Math.sin(t*0.047 + 1) + 0.7*st.gust;
  U.t.value = t; U.wind.value = wind;
  const wa = 0.25*Math.sin(t*0.02);
  U.windV.value.set(Math.cos(wa), 0, -0.25 + Math.sin(wa)*0.5).normalize();
  FU.uWind.value.copy(U.windV.value).multiplyScalar(0.8 + 1.4*wind);

  // 火勢：多層噪聲疊出的搖曳；斷枝時一陣爆燃
  st.flare = Math.max(0, st.flare - dt*0.4);
  const flick = 0.5 + 0.22*Math.sin(t*7.3) * Math.sin(t*2.9 + 1) + 0.14*Math.sin(t*13.7 + 2) + 0.12*(vn(t*3.1, 0.5) - 0.5)*2;
  fire.flick = clamp(flick, 0, 1);
  FU.uFI.value = 0.85 + 0.3*fire.flick + 0.5*st.flare;
  if (st.started && t > st.nextFall){ if (startFall(t)) st.falls++; st.nextFall = t + 110 + R()*120; }
  updateFalls(t, dt);
  GRP.mats[0].identity(); GRP.gi[0] = 1;
  fireLight.intensity = (150 + 90*fire.flick + 160*st.flare) * (1 + 0.15*Math.sin(t*23 + Math.sin(t*5)));
  fireLight.position.set(FIRE_C.x + Math.sin(t*3.1)*0.25 + U.windV.value.x*wind*0.6, FIRE_C.y + Math.sin(t*4.3)*0.2, FIRE_C.z + Math.cos(t*2.7)*0.25);
  lowFire.intensity = 26 + 18*fire.flick;
  EMB.k.value = 0.8 + 0.4*fire.flick;

  // 光與天色
  sun.color.copy(SKY.sunC);
  sun.intensity = SKY.sunI * (toSun.y > -0.02 ? 1 : 0);
  sun.target.position.set(MX, 0, MZ + 10); sun.position.copy(sun.target.position).addScaledVector(toSun, 150); sun.target.updateMatrixWorld();
  hemi.color.copy(SKY.hs); hemi.groundColor.copy(SKY.hg); hemi.intensity = SKY.hi * 1.4;
  const zen = _zc.copy(SKY.zen), hor = _hc.copy(SKY.hor);
  skyMat.uniforms.uZen.value.copy(zen); skyMat.uniforms.uHor.value.copy(hor);
  skyMat.uniforms.uSun.value.copy(toSun); skyMat.uniforms.uSunC.value.copy(SKY.sunC); skyMat.uniforms.uNight.value = night;
  scene.fog.color.copy(hor).multiplyScalar(0.92);
  // 煙的顏色：白天是灰褐的煙，夜裡幾乎是黑的
  FU.uSmk.value.setRGB(0.04, 0.034, 0.03).lerp(_gc.copy(hor).multiplyScalar(0.42), 0.7*(1 - 0.6*night));   // 煙帶一點天色：純灰在紫色天空前會被看成綠
  FU.uFC.value.setRGB(1.0, 0.42, 0.1).multiplyScalar(0.6 + 0.9*night);

  // 鏡頭：拖曳轉頭；往前走時沿著到土坡的直線，眼睛跟著地形高低
  const kx = (keys.has('arrowleft')||keys.has('a') ? 1 : 0) - (keys.has('arrowright')||keys.has('d') ? 1 : 0);
  const ky = (keys.has('arrowup') ? 1 : 0) - (keys.has('arrowdown') ? 1 : 0);
  const kw = (keys.has('w') ? 1 : 0) - (keys.has('s') ? 1 : 0);
  if (kx || ky || kw){ look.yawT += kx*dt*0.9; look.pitchT += ky*dt*0.6; look.walkT += kw*dt*0.07; look.lastIn = now; look.ret = null; clampLook(); }
  const off = Math.abs(look.yawT - HOME.yaw) + Math.abs(look.pitchT - HOME.pitch);
  if (!look.ret && off > 0.02 && look.lastIn && now - look.lastIn > 40000 && !drag.size){
    const k = Math.round((look.yawT - HOME.yaw)/(Math.PI*2)), y1 = HOME.yaw + k*Math.PI*2;
    look.ret = { t0: now, dur: 9000 + 9000*Math.min(1, off/2), y0: look.yawT, p0: look.pitchT, y1 };
  }
  if (look.ret){
    const u = Math.min(1, (now - look.ret.t0)/look.ret.dur), e = 0.5 - 0.5*Math.cos(Math.PI*u);
    look.yawT = lerp(look.ret.y0, look.ret.y1, e); look.pitchT = lerp(look.ret.p0, HOME.pitch, e);
    if (u >= 1) look.ret = null;
  }
  const lk = 1 - Math.exp(-dt*8);
  look.yaw += (look.yawT - look.yaw)*lk; look.pitch += (look.pitchT - look.pitch)*lk;
  const wPrev = look.walk; look.walk += (look.walkT - look.walk)*(1 - Math.exp(-dt*1.6));
  const speed = Math.abs(look.walk - wPrev)/Math.max(dt, 1e-3)*WALK_MAX;
  look.step = (look.step || 0) + speed*dt*1.7;
  const dirT = _fp.set(MX, 0, MZ).normalize(), wd = look.walk*WALK_MAX;
  const cx = dirT.x*wd, cz = dirT.z*wd, bob = Math.sin(look.step*Math.PI)*0.035*clamp(speed, 0, 1.4);
  const br = Math.sin(t*Math.PI*2/4.6);
  camera.position.set(cx, H(cx, cz) + EYE_H + br*0.006 + Math.abs(bob), cz);
  camera.rotation.set(look.pitch + br*0.003, look.yaw, Math.sin(look.step*Math.PI*0.5)*0.004*clamp(speed, 0, 1.4));
  camera.updateMatrixWorld();
  const dist = camera.position.distanceTo(FIRE_C);

  // 熱浪在螢幕上的範圍：投影樹冠中心，用 8 公尺換算成螢幕大小
  _fp.copy(FIRE_C).project(camera);
  const pe = camera.projectionMatrix.elements, dz = Math.max(1, dist);
  const vis = _fp.z < 1 && Math.abs(_fp.x) < 2 && Math.abs(_fp.y) < 2.5 ? 1 : 0;
  post.uniforms.uFire.value.set(_fp.x*0.5 + 0.5, _fp.y*0.5 + 0.5, vis);
  post.uniforms.uFireR.value.set(pe[0]*0.5*4.2/dz, pe[5]*0.5*4.2/dz);
  post.uniforms.uHaze.value = 0.8 + 0.4*fire.flick;
  post.uniforms.uT.value = t;
  post.uniforms.uExp.value = 1.25 + 0.75*night;
  post.uniforms.uFlash.value = st.flare*0.03*night;
  skyMat.uniforms.uFD.value.copy(FIRE_C).sub(camera.position).setY(0).normalize().setY(0.35).normalize();

  if (audio && !st.muted) audioFrame(t, dt, fire, dist);

  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  requestAnimationFrame(frame);
}

resize();
renderKeys();
requestAnimationFrame(frame);
document.getElementById('start').addEventListener('click', () => {
  st.started = true;
  document.getElementById('intro').classList.add('gone');
  unlockMedia(); startAudio();
  setUI(false);   // 與〈By the window〉相同：畫面上不留按鈕，H 鍵叫出
});
window.__fire = { flames, smoke, embers, st, look, ACT, scene, camera, FALL, startFall: () => startFall(tNow), SEG, EM };
</script>

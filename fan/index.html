<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A slow afternoon</title>
<meta property="og:title" content="A slow afternoon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* 介面：與〈An endless coast〉同一套。Instrument Serif（正體＋斜體），字一律白色，細線分隔，不加卡片 */
:root{
  --ink:#19150c;
  --ui:#ffffff;
  --ui-dim:rgba(255,255,255,.62);
  --rule:rgba(255,255,255,.45);
  --serif:"Instrument Serif","Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--ui);font-family:var(--serif)}
#c{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.hud{position:fixed;left:0;right:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-inline:28px;text-shadow:0 0 2px rgba(0,0,0,.45),0 1px 12px rgba(0,0,0,.5)}
.hud.bottom{bottom:0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.dist{display:flex;flex-direction:column;gap:6px}
.dist .num{font-size:56px;line-height:.9;font-style:italic;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dist .num em{font-size:24px;margin-left:6px;font-style:italic;color:var(--ui-dim)}
.dist small{font-size:13px;letter-spacing:.24em;color:var(--ui-dim);border-top:1px solid var(--rule);padding-top:6px;min-width:150px}
.keys{display:flex;flex-direction:column;align-items:stretch;gap:2px;font-size:16px;line-height:1.35}
.keys .row,button.k{display:grid;grid-template-columns:4em 1fr;column-gap:14px;align-items:center;text-align:left}
.keys b{font-weight:400;letter-spacing:.14em;font-size:12px;text-align:right;color:var(--ui-dim)}
.keys i{font-style:italic}
.keys .off{color:var(--ui-dim)}
button.k{pointer-events:auto;font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-shadow:inherit}
button.k:hover i{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
button.k:focus-visible{outline:1px solid var(--ui);outline-offset:2px}
#uiBtn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px));font:inherit;font-style:italic;font-size:16px;color:var(--ui);background:none;border:0;border-bottom:1px solid var(--rule);padding:6px 0 3px;cursor:pointer;text-shadow:0 0 2px rgba(0,0,0,.45),0 1px 12px rgba(0,0,0,.5);opacity:.85;-webkit-tap-highlight-color:transparent}
#uiBtn:hover{opacity:1}
#uiBtn:focus-visible{outline:1px solid var(--ui);outline-offset:4px}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:0 28px calc(56px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(10,9,6,.78),rgba(10,9,6,.25) 50%,rgba(10,9,6,0) 75%);transition:opacity 1.6s}
#intro.gone{opacity:0;pointer-events:none}
#intro h1{margin:0;font-weight:400;font-style:italic;font-size:clamp(56px,10vw,150px);line-height:.9;letter-spacing:-.02em}
#intro .rule{width:min(520px,80vw);height:1px;background:var(--rule);margin:24px 0 20px}
#start{font:inherit;font-size:22px;color:var(--ui);background:none;border:0;border-bottom:1px solid var(--ui);padding:0 0 4px;cursor:pointer;letter-spacing:.02em}
#start span{display:inline-block;transition:transform .3s}
#start:hover span{transform:translateX(6px)}
#start:focus-visible{outline:1px solid var(--ui);outline-offset:6px}
@media (max-width:560px){.dist .num{font-size:40px}.dist small{min-width:0}.hud{padding-inline:16px;gap:12px}#intro{padding-inline:16px}.keys{font-size:15px;row-gap:0}#uiBtn{right:calc(16px + env(safe-area-inset-right,0px))}}
@media (hover:none){.keys{gap:8px;font-size:19px;align-items:flex-end}.keys .row,.keys b{display:none}button.k{display:flex;justify-content:center;min-width:132px;min-height:46px;padding:0 18px;box-sizing:border-box;border:1px solid var(--rule);background:rgba(10,9,6,.28)}button.k:active{background:rgba(255,255,255,.18)}#uiBtn{font-size:18px;min-height:44px;padding:0 16px;border:1px solid var(--rule);background:rgba(10,9,6,.28);touch-action:manipulation}}
@media (prefers-reduced-motion:reduce){#intro{transition:none}#start span{transition:none}}
</style>

<canvas id="c" aria-label="Lying in bed, looking up at a ceiling fan"></canvas>
<div class="hud bottom" id="hud" hidden>
  <div></div>
  <div class="keys" id="keys"></div>
</div>
<button id="uiBtn" type="button" hidden>Hide UI</button>
<div id="intro">
  <h1>A slow afternoon</h1>
  <div class="rule"></div>
  <button id="start" type="button">Lie down <span>&rarr;</span></button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

/* ---------- 參數：色盤與〈An endless coast〉相同 ---------- */
const PALS = [
  // 五色主色盤與海岸相同；室內另加三組額外色：綠（植物、窗外樹葉，暗→亮三階）、黃（陽光照到的地方）、白（窗外的天光）
  { en:'DUSK',    pal:['#19150c','#3c3e2d','#57473f','#63648c','#7c99e4'], green:['#34502a','#5f8a34','#a4c457'], yellow:'#ecc867', white:'#f6f0dc' },
  { en:'RAIN',    pal:['#0e181e','#1b2b34','#2e434d','#52656c','#8aa2aa'], green:['#24443a','#477a58','#86b07e'], yellow:'#d4b878', white:'#e8eeea' },
  { en:'NIGHT',   pal:['#14141f','#2a2d44','#3b3d70','#5557b8','#8285f0'], green:['#26393a','#46694e','#7fa46c'], yellow:'#d2b86c', white:'#e2e2f4' },
  { en:'STALKER', pal:['#161a15','#363d33','#5f6a5c','#97a28f','#cfd6c4'], green:['#37482a','#647a3c','#a2b26a'], yellow:'#dccb86', white:'#f0f2e4' },
];
const toVec = h => { const c = new THREE.Color(); c.setStyle(h, THREE.LinearSRGBColorSpace); return new THREE.Vector3(c.r, c.g, c.b); };
const BASE_H = 540;   // 內部解析度與海岸相同：以長邊換算，點陣顆粒一樣大

// 房間（公尺）：寬 4.7（x）、長 5.7（z）、高 3.25。躺在床上，頭朝 +z，腳朝 -z
const RX = 2.35, RZ0 = -3.0, RZ1 = 2.7, RH = 3.25;   // 放大：牆角離天花板中心更遠，抬頭時天花板佔大部分畫面
const WX = -RX;                                   // 窗在左牆
const WIN = { z0:-1.9, z1:0.5, y0:0.9, y1:2.72 };  // 窗洞
const EYE = new THREE.Vector3(0.22, 0.84, 0.95);   // 躺著的眼睛位置
const FAN = new THREE.Vector3(0, 0, (RZ0 + RZ1)/2);  // 吊扇在天花板正中央
// 鏡頭模擬躺著轉頭：臉朝天花板、畫面上方是頭頂方向（+z）。
// yaw＝頭往左右轉（繞身體長軸 z），pitch＝抬頭／低頭（繞頭的左右軸）；pitch 為負是往腳那頭看。畫面不會滾轉歪斜。
// 預設正對吊扇的扇葉中心
const HOME = (() => { const d = new THREE.Vector3(FAN.x - EYE.x, RH - 0.55 - EYE.y, FAN.z - EYE.z).normalize(); return { yaw: Math.atan2(-d.x, d.y), pitch: Math.asin(d.z) }; })();
// 視角限制：只看得到天花板和牆的上半段。往腳或往頭那頭，畫面邊緣最低只到仰角 LOOK_FLOOR；左右只能從吊扇偏開 YAW_SPAN
const LOOK_FLOOR = THREE.MathUtils.degToRad(14), YAW_SPAN = 0.6;
let PITCH_MIN = -0.8, PITCH_MAX = 0.5;

/* ---------- 共用噪聲 ---------- */
function hash2(x,y){ let h = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263); h = Math.imul(h ^ (h>>>13), 1274126177); return ((h ^ (h>>>16)) >>> 0) / 4294967296; }
function vn(x,y){ const ix=Math.floor(x), iy=Math.floor(y); let fx=x-ix, fy=y-iy; fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy), b=hash2(ix+1,iy), c=hash2(ix,iy+1), d=hash2(ix+1,iy+1);
  return (a+(b-a)*fx) + ((c+(d-c)*fx) - (a+(b-a)*fx))*fy; }
function mulberry(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
const R = mulberry(20261010);

/* ---------- 渲染器：低解析 render target → 調色盤網點（與海岸同一條管線） ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;   // 硬邊陰影
const rt = new THREE.WebGLRenderTarget(4, 4, { minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter, type:THREE.HalfFloatType });
rt.depthTexture = new THREE.DepthTexture(4, 4); rt.depthTexture.type = THREE.UnsignedIntType;   // 光束要知道每個像素前面的東西有多遠

const scene = new THREE.Scene();
scene.background = new THREE.Color(0.5, 0.5, 0.5);
const camera = new THREE.PerspectiveCamera(56, 1, 0.03, 60);
camera.rotation.order = 'ZXY';   // 先繞身體長軸轉頭，再在頭的座標裡抬頭／低頭
camera.position.copy(EYE);

const post = new THREE.ShaderMaterial({
  uniforms:{ tScene:{ value: rt.texture }, tDepth:{ value: rt.depthTexture }, uInvProj:{ value: new THREE.Matrix4() }, uCamW:{ value: new THREE.Matrix4() }, uD:{ value: new THREE.Vector3(1,-1,0) }, uBI:{ value: 1 }, uT:{ value: 0 }, pal:{ value: PALS[0].pal.map(toVec) }, grn:{ value: PALS[0].green.map(toVec) }, yel:{ value: toVec(PALS[0].yellow) }, wht:{ value: toVec(PALS[0].white) }, lo:{ value: 0.10 }, hi:{ value: 0.86 }, uNat:{ value: 1 }, uExp:{ value: 1.2 }, uPS:{ value: new THREE.Vector2(1,1) }, uSC:{ value: new THREE.Vector3(1,0.86,0.56) } },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader:`
    uniform sampler2D tScene; uniform sampler2D tDepth; uniform mat4 uInvProj, uCamW; uniform vec3 uD; uniform float uBI, uT; uniform vec3 pal[5]; uniform vec3 grn[3]; uniform vec3 yel, wht; uniform float lo, hi, uNat, uExp; uniform vec2 uPS; uniform vec3 uSC; varying vec2 vUv;
    float bayer2(vec2 a){ a=floor(a); return fract(dot(a, vec2(.5, a.y*.75))); }
    float bayer4(vec2 a){ return bayer2(.5*a)*.25 + bayer2(a); }
    /*BEAM*/
    // 牆角、物體交界處的漫射遮蔽（螢幕空間 AO）：光反彈不進去的地方自然變暗
    vec3 vpos(vec2 uv){ float z = texture2D(tDepth, uv).x*2. - 1.; vec4 v = uInvProj * vec4(uv*2. - 1., z, 1.); return v.xyz / v.w; }
    float ssao(){
      vec3 P = vpos(vUv);
      if (-P.z > 20.) return 1.;
      vec3 N = normalize(cross(dFdx(P), dFdy(P))); if (dot(N, P) > 0.) N = -N;
      const float RAD = 0.55;
      vec2 sr = RAD * uPS / -P.z * 0.5;
      float a0 = bayer4(gl_FragCoord.xy) * 6.2832, occ = 0.;
      for (int i = 0; i < 12; i++){
        float fi = float(i), a = a0 + fi * 2.3999, rr = (fi + 0.5) / 12.;
        vec3 Q = vpos(vUv + vec2(cos(a), sin(a)) * sr * rr);
        vec3 D = Q - P; float dl = length(D);
        occ += max(0., dot(N, D / max(dl, 1e-4)) - 0.08) * (1. - smoothstep(RAD*0.6, RAD*1.4, dl));
      }
      return clamp(1. - occ / 12. * 1.6, 0.25, 1.);
    }
    vec3 aces(vec3 x){ return clamp((x*(2.51*x + .03)) / (x*(2.43*x + .59) + .14), 0., 1.); }
    void main(){
      vec3 c = texture2D(tScene, vUv).rgb;
      c *= ssao();
      c += beams();
      float l = pow(max(dot(c, vec3(.299,.587,.114)), 0.), 1./2.2);
      float v = clamp((l-lo)/(hi-lo), 0., 1.) * 4.;
      float b = bayer4(gl_FragCoord.xy);
      float i = clamp(floor(v + b), 0., 4.);
      vec3 o = i < .5 ? pal[0] : i < 1.5 ? pal[1] : i < 2.5 ? pal[2] : i < 3.5 ? pal[3] : pal[4];
      // 額外色：依場景顏色的色相判斷。綠＝植物，暖色且夠亮＝陽光照到的地方，近白＝窗外的天光
      float mx = max(c.r, max(c.g, c.b)), mn = min(c.r, min(c.g, c.b)), ch = (mx - mn) / max(mx, 1e-4);
      if (ch > 0.22 && c.g >= c.r && c.g > c.b * 1.25) {
        float gi = clamp(floor(clamp(l * 1.9, 0., 1.) * 2. + b), 0., 2.);
        o = gi < .5 ? grn[0] : gi < 1.5 ? grn[1] : grn[2];
      } else if (ch > 0.3 && c.r > c.b && l > 0.45) {
        float yi = clamp(floor(clamp((l - 0.5) / 0.42, 0., 1.) * 2. + b), 0., 2.);
        o = yi < .5 ? pal[3] : yi < 1.5 ? yel : wht;
      } else if (l > 0.95 && ch < 0.12) {
        o = wht;
      }
      // 自然色：曝光 → ACES 色調映射 → sRGB → 每個色版用同一組 4×4 Bayer 網點量化成 7 階，保留點陣的顆粒但顏色是真的
      vec3 g = pow(aces(c * uExp), vec3(1./2.2));
      vec3 nat = clamp(floor(g * 6. + b) / 6., 0., 1.);
      gl_FragColor = vec4(mix(o, nat, uNat), 1.);
    }`,
  depthTest:false, depthWrite:false
});
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), post));

let RWID = 4, RHGT = 4, SCALE = 3;
function resize(){
  const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 3), DW = W*dpr, DH = H*dpr;
  SCALE = Math.max(2, Math.round(Math.max(DW, DH) / (BASE_H*16/9)));
  RWID = Math.ceil(DW / SCALE); RHGT = Math.ceil(DH / SCALE);
  renderer.setSize(RWID, RHGT, false);
  canvas.style.width = RWID*SCALE/dpr + 'px'; canvas.style.height = RHGT*SCALE/dpr + 'px';
  rt.setSize(RWID, RHGT); rt.depthTexture.image.width = RWID; rt.depthTexture.image.height = RHGT;
  camera.aspect = RWID / RHGT;
  // 橫式垂直視角 56°；直式改用較廣的視角，最多 78°
  const a = camera.aspect;
  camera.fov = a >= 1 ? 56 : Math.min(78, 2*THREE.MathUtils.radToDeg(Math.atan(Math.tan(THREE.MathUtils.degToRad(28))*Math.max(1, 1.25/a)*0.92)));
  camera.updateProjectionMatrix();
  // 往下最多看到畫面下緣碰到牆的中段；直式視角較廣，所以能往下的幅度更小
  const halfV = THREE.MathUtils.degToRad(camera.fov/2);
  PITCH_MIN = Math.min(HOME.pitch, LOOK_FLOOR + halfV - Math.PI/2);
  PITCH_MAX = Math.max(HOME.pitch + 0.05, Math.min(0.55, Math.PI/2 - halfV - LOOK_FLOOR));   // 往頭頂方向仰，脖子能轉的有限
  if (typeof look !== 'undefined') clampLook();
}
addEventListener('resize', resize);

/* ---------- 材質：用真實的反照率（白牆略暖、木地板、米色吊扇），之後統一換成粗糙的 PBR 材質，好接窗口的面光源 ---------- */
const lam = (hex, o = {}) => new THREE.MeshLambertMaterial({ color: hex, flatShading: true, ...o });
const M = {
  wall: lam(0xeeeae2), ceil: lam(0xf3f0ea), trim: lam(0xe2ddd2), floor: lam(0x9c7a5a),
  fan: lam(0xe0dbcf), fanDark: lam(0x4a4844), frame: lam(0xc9c9c4), iron: lam(0x3a3937),
  blanket: lam(0xb8c4d2), sheet: lam(0xefeeea), wood: lam(0xb48e66), book: null,
  curtain: new THREE.MeshLambertMaterial({ color: 0xe8d9b2, emissive: 0x6a5226, side:THREE.DoubleSide }),   // 米黃色厚簾；自發光模擬逆光透過布的暖光
  leafOut: lam(0x4f8a2c, { side:THREE.DoubleSide }), pot: lam(0xd7d6d2), plant: lam(0x5f9a32, { side:THREE.DoubleSide }),
};
const box = (w,h,d,mat,x,y,z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; scene.add(m); return m; };

/* ---------- 房間 ---------- */
const T = 0.3;    // 牆厚（加厚並互相重疊，避免牆角漏光）
// 地板、天花板
box(RX*2+T*2, T, RZ1-RZ0+T*2, M.floor, 0, -T/2, (RZ0+RZ1)/2);
box(RX*2+T*2, T, RZ1-RZ0+T*2, M.ceil, 0, RH+T/2, (RZ0+RZ1)/2);
// 右牆、前牆（腳那頭）、後牆（頭那頭）
box(T, RH+T*2, RZ1-RZ0+T*2, M.wall, RX+T/2, RH/2, (RZ0+RZ1)/2);
box(RX*2+T*2, RH+T*2, T, M.wall, 0, RH/2, RZ0-T/2);
box(RX*2+T*2, RH+T*2, T, M.wall, 0, RH/2, RZ1+T/2);
// 左牆：四塊圍出窗洞
box(T, WIN.y0+T, RZ1-RZ0+T*2, M.wall, WX-T/2, (WIN.y0-T)/2, (RZ0+RZ1)/2);
box(T, RH-WIN.y1+T, RZ1-RZ0+T*2, M.wall, WX-T/2, (RH+T+WIN.y1)/2, (RZ0+RZ1)/2);
box(T, WIN.y1-WIN.y0, WIN.z0-RZ0+T, M.wall, WX-T/2, (WIN.y0+WIN.y1)/2, (RZ0-T+WIN.z0)/2);
box(T, WIN.y1-WIN.y0, RZ1+T-WIN.z1, M.wall, WX-T/2, (WIN.y0+WIN.y1)/2, (WIN.z1+RZ1+T)/2);
// 天花板收邊線與踢腳板
for (const [w,d,x,z] of [[RX*2,0.05,0,RZ0+0.025],[RX*2,0.05,0,RZ1-0.025],[0.05,RZ1-RZ0,-RX+0.025,(RZ0+RZ1)/2],[0.05,RZ1-RZ0,RX-0.025,(RZ0+RZ1)/2]]){
  box(w, 0.06, d, M.trim, x, RH-0.03, z);
  box(w, 0.09, d, M.trim, x, 0.045, z);
}

/* ---------- 窗：鋁窗框、兩扇推拉窗、上方氣窗、外側鐵窗 ---------- */
const WM = WIN.z0 + (WIN.z1-WIN.z0)/2, TRANSOM = 2.24;
const fr = (w,h,d,x,y,z,m=M.frame) => box(w,h,d,m,x,y,z);
fr(0.1, 0.05, WIN.z1-WIN.z0, WX-0.05, WIN.y0+0.025, WM);
fr(0.1, 0.05, WIN.z1-WIN.z0, WX-0.05, WIN.y1-0.025, WM);
fr(0.1, WIN.y1-WIN.y0, 0.05, WX-0.05, (WIN.y0+WIN.y1)/2, WIN.z0+0.025);
fr(0.1, WIN.y1-WIN.y0, 0.05, WX-0.05, (WIN.y0+WIN.y1)/2, WIN.z1-0.025);
fr(0.08, 0.045, WIN.z1-WIN.z0, WX-0.05, TRANSOM, WM);                      // 氣窗橫料
fr(0.035, TRANSOM-WIN.y0, 0.045, WX-0.03, (WIN.y0+TRANSOM)/2, WM-0.03);   // 兩扇窗交會的直料
fr(0.035, TRANSOM-WIN.y0, 0.045, WX-0.07, (WIN.y0+TRANSOM)/2, WM+0.03);
fr(0.035, WIN.y1-TRANSOM, 0.035, WX-0.05, (TRANSOM+WIN.y1)/2, WM);

const CTOP = RH - 0.05, CBOT = WIN.y0 - 0.12, CH = CTOP - CBOT;
function curtainPanel(z0, z1, pleat, flare){
  const nz = Math.round((z1 - z0)/0.02), g = new THREE.PlaneGeometry(z1-z0, CH, nz, 22).rotateY(Math.PI/2);
  const base = g.attributes.position.array.slice();
  const m = new THREE.Mesh(g, M.curtain); m.position.set(WX + 0.1, CBOT + CH/2, (z0+z1)/2); m.castShadow = m.receiveShadow = true; scene.add(m);
  return { g, base, pleat, flare, z0, z1, zc:(z0+z1)/2 };
}
const curtains = [curtainPanel(CZ, WIN.z1 + 0.45, 0.13, 1), curtainPanel(WIN.z0 - 0.4, WIN.z0 + 0.02, 0.09, 0)];
box(0.03, 0.03, WIN.z1-WIN.z0+1.3, M.frame, WX+0.1, CTOP+0.03, WM);   // 窗簾軌道
function updateCurtains(t, wind){
  for (const c of curtains){
    const p = c.g.attributes.position.array;
    for (let i = 0; i < p.length; i += 3){
      const lz = c.base[i+2], ly = c.base[i+1], z = lz + c.zc, hang = (CH/2 - ly)/CH;   // 0 在軌道、1 在下擺
      // 打褶：上端每個褶子收得很緊，越往下越鬆
      const ph = (lz / c.pleat) * Math.PI*2, tight = 1 - hang*0.55;
      const fold = (Math.pow(Math.abs(Math.sin(ph)), 0.5 + hang) * Math.sign(Math.sin(ph))) * 0.03 * (0.7 + 0.6*hang) * tight;
      // 鼓起：下擺往室內膨出，靠開窗那一側最大，隨風慢慢呼吸
      const edge = c.flare ? THREE.MathUtils.smoothstep(c.z1, CZ, z) : 0.2;
      const breath = 0.75 + 0.25*Math.sin(t*0.35 + z*1.3) + 0.12*Math.sin(t*0.9 + z*3.0)*wind;
      const bulge = Math.pow(Math.max(0, hang - 0.35)/0.65, 1.8) * (0.08 + 0.42*edge) * breath;
      p[i] = c.base[i] + fold + bulge;
      p[i+1] = ly + bulge*0.35*edge;                                   // 下擺被吹起來一點
      p[i+2] = lz - bulge*0.18*edge;                                   // 開窗側的邊往外翻
    }
    c.g.attributes.position.needsUpdate = true; c.g.computeVertexNormals();
  }
}

function updateLeaves(t, breeze){

/* ---------- 光束（體積光）：在後製時沿每個像素的視線往前走，經過陽光穿窗而入的那塊空間就累加光量。
   窗框、鐵窗、窗簾、樹葉擋住的部分沒有光，所以看得到一道道帶條紋的光柱 ---------- */
post.fragmentShader = post.fragmentShader.replace('/*BEAM*/', `
  float bh(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5); }
  float bn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(bh(i),bh(i+vec2(1,0)),f.x), mix(bh(i+vec2(0,1)),bh(i+vec2(1,1)),f.x), f.y); }
  float winMask(vec3 p){
    float s = (p.x - ${WX.toFixed(3)}) / uD.x;
    if (s < 0.05 || s > 6.) return 0.;
    vec3 q = p - uD * s;                                     // 這一點的光是從窗面哪裡進來的
    if (q.z < ${WIN.z0.toFixed(3)} || q.z > ${WIN.z1.toFixed(3)} || q.y < ${WIN.y0.toFixed(3)} || q.y > ${WIN.y1.toFixed(3)}) return 0.;
    float m = 1.;
    m *= step(0.026, abs(q.z - ${WM.toFixed(3)}));            // 兩扇窗交會的直料
    m *= step(0.024, abs(q.y - ${TRANSOM.toFixed(3)}));       // 氣窗橫料
    float gz = fract((q.z - ${(WIN.z0+0.06).toFixed(3)}) / ${GRILL.step.toFixed(3)} + 0.5) - 0.5;
    m *= step(${(GRILL.w/2/GRILL.step).toFixed(4)}, abs(gz));  // 鐵窗直桿
    ${GRILL.bars.map(y => `m *= step(0.012, abs(q.y - ${y.toFixed(3)}));`).join('\n    ')}
    if (q.z > ${CZ.toFixed(3)}) m *= 0.12 + 0.88 * smoothstep(${(CBOT+0.55).toFixed(3)}, ${(CBOT+0.15).toFixed(3)}, q.y);   // 窗簾後面幾乎沒光，只有下擺鼓起的縫隙漏出來
    float leaf = smoothstep(0.4, 0.7, bn(q.zy*4.5 + vec2(uT*0.2, sin(uT*0.35)*0.5)));
    m *= mix(1., 0.3, leaf * smoothstep(2.0, 2.5, q.y));     // 上緣被窗外樹葉擋掉一些，會晃動
    return m * exp(-s * 0.18);
  }
  vec3 beams(){
    if (uBI < 0.01) return vec3(0.);
    float z = texture2D(tDepth, vUv).x * 2. - 1.;
    vec4 v = uInvProj * vec4(vUv*2. - 1., z, 1.); v /= v.w;
    vec3 e = uCamW[3].xyz, w = (uCamW * v).xyz, d = w - e;
    float len = min(length(d), 8.); d = normalize(d);
    const int N = 32;
    float jit = fract(dot(floor(gl_FragCoord.xy), vec2(0.25, 0.5)) + 0.125*mod(floor(gl_FragCoord.y), 2.));
    float acc = 0.;
    for (int i = 0; i < N; i++){
      float t = (float(i) + jit) / float(N) * len;
      vec3 p = e + d * t;
      float dust = 0.75 + 0.25 * bn(p.xy*2.5 + p.z + uT*0.15);
      acc += winMask(p) * dust;
    }
    acc *= len / float(N);
    return uSC * acc * 0.5 * uBI;
  }
`);
post.needsUpdate = true;

/* ---------- 灰塵：只在光束裡看得到，被電扇的風攪得慢慢打轉 ---------- */
const DUST_N = 520;
const dustMat = new THREE.ShaderMaterial({
  uniforms:{ uD:{ value: sunDir }, uI:{ value: 1 }, uT:{ value: 0 }, uFan:{ value: 0 }, uPx:{ value: 1 } },
  vertexShader:`
    attribute vec4 aS; uniform vec3 uD; uniform float uT, uFan, uPx; varying float vA;
    void main(){

{

// 鏡頭只轉不移：拖曳轉頭，雙擊／雙點回到看吊扇的角度
const drag = new Map(); let lastTap = 0;
canvas.addEventListener('pointerdown', e => { if (!st.started) return; resumeAudio();

// 預設是自然色；P 依序切到海岸的四組色盤（DUSK → RAIN → NIGHT → STALKER）再回到自然色，切換時淡入淡出

  if (st.pal < 0) return;

/* ---------- 聲音：吊扇的風聲與馬達聲、窗外的蟬（不放鳥叫） ---------- */
let audio = null;

['touchend','click','keydown'].forEach(ev => addEventListener(ev, () => { if (st.started) resumeAudio(); }, { capture:true, passive:true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) resumeAudio(); });
// iOS 靜音鍵開著時 WebAudio 沒聲音：先播一段無聲的 <audio>，把 session 切成媒體播放
function unlockMedia(){

  try {
    const n = 2205, b = new ArrayBuffer(44 + n*2), v = new DataView(b), w = (o, t) => { for (let i=0;i<t.length;i++) v.setUint8(o+i, t.charCodeAt(i)); };
    w(0,'RIFF'); v.setUint32(4, 36 + n*2, true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,22050,true); v.setUint32(28,44100,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40, n*2, true);
    const el = new Audio(URL.createObjectURL(new Blob([b], { type:'audio/wav' })));

}
function startAudio(){
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const len = ac.sampleRate*4, brown = ac.createBuffer(1, len, ac.sampleRate), white = ac.createBuffer(1, len, ac.sampleRate);
    const bd = brown.getChannelData(0), wd = white.getChannelData(0); let last = 0;
    for (let i=0;i<len;i++){ const w = Math.random()*2-1; wd[i] = w; last = (last + 0.02*w)/1.02; bd[i] = last*3.5; }
    const master = ac.createGain(); master.gain.value = st.muted ? 0 : 0.9;
    // 手機喇叭放不出低頻：觸控裝置把風聲往中頻移，並用壓縮器拉高整體音量
    const phone = matchMedia('(hover: none)').matches;
    if (phone){ const comp = ac.createDynamicsCompressor(); comp.threshold.value = -30; comp.ratio.value = 4; const mk = ac.createGain(); mk.gain.value = 2.5; master.connect(comp); comp.connect(mk); mk.connect(ac.destination); }

    const humG = ac.createGain(); humG.gain.value = 0;
    hum.connect(humF); humF.connect(humG); humG.connect(master); hum.start();

    const cicAM = ac.createGain(); cicAM.gain.value = 0.6;

/* ---------- 每一格 ---------- */
let last = performance.now(), T0 = last;
function frame(now){
  const dt = THREE.MathUtils.clamp((now - last)/1000, 0, 0.05); last = now;
  const t = (now - T0)/1000;

  // 吊扇：開機慢慢加速、關掉後滑行很久才停
  st.spin = FAN_RPS;
  st.angle = (st.angle + st.spin*Math.PI*2*dt) % (Math.PI*2*3);
  rotor.rotation.y = st.angle;
  const wob = 0.0015;
  fan.rotation.x = Math.sin(t*st.spin*Math.PI*2*0.5) * wob; fan.rotation.z = Math.cos(t*st.spin*Math.PI*2*0.5 + 0.7) * wob;

  // 太陽：12 分鐘走完夏天的中午 12 點到下午 5 點。中午很高、光只落在窗邊；越到下午越低、越偏西，光斜斜照進整個房間，顏色也越來越暖（西曬）
  st.day = (st.day + dt/DAY_LEN) % 1;
  const u = st.day, hr = 12 + 5*u;
  const elev = THREE.MathUtils.degToRad(THREE.MathUtils.lerp(70, 5, Math.pow(u, 0.7)));
  const az = THREE.MathUtils.lerp(0.35, 1.32, u);                                  // 從偏南轉到正西（窗在西牆）
  sunDir.set(Math.sin(az)*Math.cos(elev), -Math.sin(elev), -Math.cos(az)*Math.cos(elev)).normalize(); aimSun();
  sun.color.lerpColors(SUN_NOON, SUN_LATE, THREE.MathUtils.smoothstep(u, 0.2, 1));
  // 一圈結束時用一段雲遮把太陽藏起來，再回到中午
  const wrap = THREE.MathUtils.smoothstep(u, 0, 0.02) * (1 - THREE.MathUtils.smoothstep(u, 0.975, 1));
  if (t > st.nextCloud){ st.sunTarget = 0.3 + Math.random()*0.25; st.cloudUntil = t + 6 + Math.random()*10; st.nextCloud = st.cloudUntil + 45 + Math.random()*70; }
  if (st.cloudUntil && t > st.cloudUntil){ st.sunTarget = 1; st.cloudUntil = 0; }
  st.sunK += (st.sunTarget - st.sunK) * (1 - Math.exp(-dt/2.2));
  const sk = st.sunK * (0.2 + 0.8*wrap);
  aimBounce();
  const breeze = 0.5 + 0.5*Math.sin(t*0.21) * Math.sin(t*0.077 + 1.3);
  sun.intensity = 6.0 * sk;
  // 反彈光跟著直射進房間的陽光多寡走：太陽越低、照進來的面積越大，房間整體越亮越暖
  const inK = sk * (0.55 + 0.45*THREE.MathUtils.smoothstep(u, 0, 0.6));
  bounce.intensity = 0.4 + 3.0*inK; bounce.color.copy(sun.color).multiply(BOUNCE_TINT);
  hemi.intensity = 0.25 + 0.4*inK;
  skyWin.intensity = 2.2 + 1.2*sk; curWin.intensity = 0.4 + 1.4*sk;
  post.uniforms.uSC.value.set(sun.color.r, sun.color.g, sun.color.b);
  post.uniforms.uBI.value = sk; post.uniforms.uT.value = t; post.uniforms.uD.value.copy(sunDir);
  glowMat.uniforms.uI.value = sk; M.curtain.emissive.copy(CURTAIN_GLOW).multiplyScalar(0.25 + 0.75*sk);
  dustMat.uniforms.uI.value = sk; dustMat.uniforms.uT.value = t; dustMat.uniforms.uFan.value = WIND;
  updateLeaves(t, breeze);
  updateCurtains(t, 0.25 + 0.75*WIND + 0.3*breeze);

  // 鏡頭：只轉不移。閒置 1 分鐘後花最多 30 秒慢慢轉回看吊扇的角度（與海岸相同的節奏）
  const kx = (keys.has('arrowleft')||keys.has('a') ? 1 : 0) - (keys.has('arrowright')||keys.has('d') ? 1 : 0);
  const ky = (keys.has('arrowup')||keys.has('w') ? 1 : 0) - (keys.has('arrowdown')||keys.has('s') ? 1 : 0);
  if (kx || ky){ look.yawT += kx*dt*0.9; look.pitchT += ky*dt*0.7; look.lastIn = now; look.ret = null; clampLook(); }
  const off = Math.max(Math.abs(look.yawT - HOME.yaw)/YAW_SPAN, Math.abs(look.pitchT - HOME.pitch)/(PITCH_MAX - PITCH_MIN));
  if (!look.ret && off > 0.01 && look.lastIn && now - look.lastIn > 60000 && !drag.size){
    look.ret = { t0: now, dur: 30000*Math.min(1, off), y0: look.yawT, p0: look.pitchT };
  }
  if (look.ret){
    const u = Math.min(1, (now - look.ret.t0)/look.ret.dur), e = 0.5 - 0.5*Math.cos(Math.PI*u);
    look.yawT = THREE.MathUtils.lerp(look.ret.y0, HOME.yaw, e); look.pitchT = THREE.MathUtils.lerp(look.ret.p0, HOME.pitch, e);
    if (u >= 1) look.ret = null;
  }

  const lk = 1 - Math.exp(-dt*9);
  look.yaw += (look.yawT - look.yaw)*lk; look.pitch += (look.pitchT - look.pitch)*lk;
  // 呼吸：鏡頭極輕微地起伏
  const br = Math.sin(t*Math.PI*2/5.2);
  camera.position.set(EYE.x, EYE.y + br*0.004, EYE.z);
  camera.rotation.set(Math.PI/2 + look.pitch + br*0.0025, 0, look.yaw);
  dustMat.uniforms.uPx.value = Math.max(1, Math.round(RHGT/540));

  updatePalette(dt);

  if (audio && !st.muted){

    audio.airF.frequency.setTargetAtTime((audio.phone ? 750 : 380) + 380*s, at, 0.3);
    audio.lfo.frequency.setTargetAtTime(Math.max(0.2, st.spin*3), at, 0.2); audio.lfoG.gain.setTargetAtTime(0.35*s, at, 0.3);
    audio.hum.frequency.setTargetAtTime(96 + 10*s, at, 0.5); audio.humG.gain.setTargetAtTime(0.02*Math.min(1, s*3), at, 0.4);
    audio.cicG.gain.setTargetAtTime((0.006 + 0.006*(0.5 + 0.5*Math.sin(t*0.05)))*(audio.phone ? 1.5 : 1), at, 1.5);
    audio.rusG.gain.setTargetAtTime(0.004 + 0.01*breeze, at, 0.8);
  }


  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  post.uniforms.uInvProj.value.copy(camera.projectionMatrixInverse); post.uniforms.uPS.value.set(camera.projectionMatrix.elements[0], camera.projectionMatrix.elements[5]); post.uniforms.uCamW.value.copy(camera.matrixWorld);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  requestAnimationFrame(frame);
}

{
